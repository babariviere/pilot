packages:
  - packages/*

overrides:
  # Keep every Pi SDK package on one release: mixed releases have incompatible APIs.
  "@earendil-works/pi-coding-agent>@earendil-works/pi-codemode": 1.4.0
  mermaid>katex: 0.19.1
  "@earendil-works/pi-codemode": 1.4.0
  "@earendil-works/chord": 1.4.0
  "@earendil-works/pi-agent-core": 1.4.0
  "@earendil-works/pi-ai": 1.4.0
  "@earendil-works/pi-durable": 1.4.0
  "@earendil-works/pi-mcp": 1.4.0
  "@earendil-works/pi-tui": 1.4.0

# Only these dependencies may run install scripts.
allowBuilds:
  esbuild: true
  node-pty: true
  fsevents: true
  protobufjs: true
  "@google/genai": true

patchedDependencies:
  '@earendil-works/pi-coding-agent@1.3.0': patches/@earendil-works__pi-coding-agent@1.3.0.patch
