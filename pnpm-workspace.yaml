packages:
   - packages/*

overrides:
   # Keep every Pi SDK package on one release: mixed releases have incompatible APIs.
   "@earendil-works/pi-coding-agent>@earendil-works/pi-codemode": 1.5.0
   mermaid>katex: 0.19.1
   # Keep the bundled CLI on the same external undici as the SDK.
   "@earendil-works/pi-coding-agent>undici": 8.12.3
   "@earendil-works/pi-codemode": 1.5.0
   "@earendil-works/chord": 1.5.0
   "@earendil-works/pi-agent-core": 1.5.0
   "@earendil-works/pi-ai": 1.5.0
   "@earendil-works/pi-durable": 1.5.0
   "@earendil-works/pi-mcp": 1.5.0
   "@earendil-works/pi-tui": 1.5.0

# Only these dependencies may run install scripts.
allowBuilds:
   esbuild: true
   node-pty: true
   fsevents: true
   protobufjs: true
   "@google/genai": true

patchedDependencies:
   "@earendil-works/pi-coding-agent@1.5.0": patches/@earendil-works__pi-coding-agent@1.5.0.patch
   "@earendil-works/pi-durable@1.5.0": patches/@earendil-works__pi-durable@1.5.0.patch
   "pi-posthorse@0.10.10": patches/pi-posthorse@0.10.10.patch

minimumReleaseAgeExclude:
   - "@biomejs/biome@2.6.5"
   - "@biomejs/cli-android-arm64@2.6.5"
   - "@biomejs/cli-android-x64@2.6.5"
   - "@biomejs/cli-darwin-arm64@2.6.5"
   - "@biomejs/cli-darwin-x64@2.6.5"
   - "@biomejs/cli-linux-arm64-musl@2.6.5"
   - "@biomejs/cli-linux-arm64@2.6.5"
   - "@biomejs/cli-linux-x64-musl@2.6.5"
   - "@biomejs/cli-linux-x64@2.6.5"
   - "@biomejs/cli-win32-arm64@2.6.5"
   - "@biomejs/cli-win32-x64@2.6.5"
   - typebox@1.4.4
   - pi-posthorse@0.10.10
