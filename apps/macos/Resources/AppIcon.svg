    <path id="plane" d="M 0 -300 C 17 -300 26 -286 26 -262 L 26 -72 L 276 44 Q 290 51 290 66 L 290 72 Q 290 84 277 81 L 26 30 L 26 168 L 108 222 Q 116 228 116 238 L 116 244 Q 116 254 105 252 L 12 236 Q 0 262 -12 236 L -105 252 Q -116 254 -116 244 L -116 238 Q -116 228 -108 222 L -26 168 L -26 30 L -277 81 Q -290 84 -290 72 L -290 66 Q -290 51 -276 44 L -26 -72 L -26 -262 C -26 -286 -17 -300 0 -300 Z"/>
