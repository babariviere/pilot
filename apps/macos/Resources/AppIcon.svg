<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5AB8FF"/>
      <stop offset="0.55" stop-color="#2F7BF5"/>
      <stop offset="1" stop-color="#1E3FBF"/>
    </linearGradient>
    <radialGradient id="glowWarm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD9A8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFD9A8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7FF3FF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#7FF3FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tileRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="0.7" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="tileSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glassFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.78"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#DDEBFF" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="glassRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="0.75" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="glassInner" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0B2A8A" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#0B2A8A" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <path id="plane" d="M 0 -340 C 30 -340 46 -306 46 -262 L 46 -96 L 318 52 Q 332 60 332 76 L 332 96 Q 332 110 318 106 L 46 34 L 46 196 L 140 262 Q 150 270 150 282 L 150 300 Q 150 312 138 309 L 0 276 L -138 309 Q -150 312 -150 300 L -150 282 Q -150 270 -140 262 L -46 196 L -46 34 L -318 106 Q -332 110 -332 96 L -332 76 Q -332 60 -318 52 L -46 -96 L -46 -262 C -46 -306 -30 -340 0 -340 Z"/>
    <clipPath id="planeClip"><use href="#plane" transform="translate(512 520) rotate(45)"/></clipPath>
    <filter id="blurBg" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="spec" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <g id="backdrop">
      <rect x="100" y="100" width="824" height="824" fill="url(#sky)"/>
      <circle cx="790" cy="250" r="300" fill="url(#glowWarm)"/>
      <circle cx="230" cy="760" r="330" fill="url(#glowCyan)"/>
      <circle cx="800" cy="860" r="260" fill="url(#glowViolet)"/>
    </g>
  </defs>
  <rect x="100" y="118" width="824" height="824" rx="185" fill="#0A1E5C" opacity="0.35" filter="url(#tileShadow)"/>
  <g clip-path="url(#tile)">
    <use href="#backdrop"/>
    <ellipse cx="512" cy="150" rx="520" ry="230" fill="url(#tileSheen)"/>
  </g>
  <use href="#plane" transform="translate(540 556) rotate(45)" fill="#071A5E" opacity="0.45" filter="url(#soft)"/>
  <g clip-path="url(#planeClip)">
    <g filter="url(#blurBg)" transform="translate(512 520) scale(1.12) translate(-512 -520)"><use href="#backdrop"/></g>
    <use href="#plane" transform="translate(512 520) rotate(45)" fill="url(#glassFill)"/>
    <use href="#plane" transform="translate(512 520) rotate(45)" fill="none" stroke="url(#glassInner)" stroke-width="40"/>
  </g>
  <use href="#plane" transform="translate(512 520) rotate(45)" fill="none" stroke="url(#glassRim)" stroke-width="5" stroke-linejoin="round"/>
  <g clip-path="url(#planeClip)">
    <path d="M -22 -300 C -26 -200 -26 -40 -26 120" transform="translate(512 520) rotate(45)" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="10" stroke-linecap="round" fill="none" filter="url(#spec)"/>
  </g>
  <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="url(#tileRim)" stroke-width="4"/>
</svg>
