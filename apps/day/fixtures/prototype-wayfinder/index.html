<title>Pilot prototype · Wayfinder map</title>
<!--
PROTOTYPE. Throw away. Not Pilot app code; the app stays native (NSH).

Question: how should a mission's Wayfinder map be shown so you see at a glance what is settled,
what is still unknown and what happens next, and can check where each answer came from?

Four variants on one page, switched with ?variant=A|B|C|D and the bottom bar (or the arrow keys):
  A  Map       a visual map: settled, open now, waiting, fog of war and the destination as columns,
               with lines for "waits for" and "became". Select a card to inspect it.
  B  Outline   a structured document: what happens next, unanswered questions by kind, settled
               choices with their sources, fog of war and build tasks. Open a row to inspect it.
  C  Rounds    an optional, lighter map read top to bottom: one row per planning round, with what
               it explored, what it produced and the next steps it set up. Lines join a next step
               to the later round that took it up. Select an output to see its source and what changed.
  D  Expedition  a playful last experiment: the same records drawn as an expedition chart. Settled answers
               are inked islands, open questions sit on blank ground, fog of war is fog, trails show what
               waits for what and each planning round is a camp on Pilot's route. The compass points at
               what needs you. Select a place for field notes with its real sources.

All variants show the same mission ("Pilot on Linux desktops", from the Day mock planning world in
apps/day/native/src/plan_world.rs) with the same records the native map reads: questions with their
kind (interview, research, prototype) and state, fog of war, original sources, agreement and tasks.

Shape follows the upstream "prototype" skill (UI.md: structurally different variants on one route,
floating switcher, ?variant=; LOGIC.md: pure model in its own script block, visible state panel,
free play and guided walkthroughs). Source: mattpocock/skills at
4ae2317ddb22b046e26455e4f9c9b3aaaf62212d, MIT, Copyright 2026 Matt Pocock, vendored unmodified in
packages/kernel/skills/mission-planning/upstream/prototype. Adapted to one self-contained file that
opens in a browser, because the user asked to review prototypes there.

Mock data only, in memory. No network, no credentials, no daemon, no provider calls.
-->
<style>

*{box-sizing:border-box}

p{margin:0}
:focus{outline:none}
:focus-visible{outline:2px solid color-mix(in srgb,var(--primary) 45%,transparent);outline-offset:2px;border-radius:6px}

/* window chrome */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;height:48px;padding:0 16px;background:var(--bg);border-bottom:1px solid var(--border)}

.crumb{font-size:13.5px;color:var(--mfg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.crumb b{color:var(--fg);font-weight:600}
.nav{display:flex;gap:2px}
.nav button{border:0;background:none;padding:5px 10px;border-radius:7px;cursor:pointer;color:var(--mfg);font-size:13.5px}
.nav button:hover{background:var(--hl)}
.nav button.on{color:var(--fg);background:var(--hl);font-weight:500}

/* page */
.page{max-width:720px;margin:0 auto;padding:40px 24px 170px}
.page.wide{max-width:1320px;padding:32px 28px 150px}
.page.wide .head{max-width:760px}
.date{font-size:13px;color:var(--faint)}
h1{font-size:28px;line-height:1.2;font-weight:600;letter-spacing:-.012em;margin:6px 0 8px}
h2{font-size:17px;font-weight:600;margin:0 0 4px}
h3{font-size:15px;font-weight:600;margin:0}
.sub{color:var(--mfg);max-width:64ch}
.meta{font-size:13px;color:var(--mfg)}
.faint{color:var(--faint)}
.small{font-size:13px}
.needs-ink{color:var(--needs-ink)}
.sec{margin-top:34px}
.sec-title{display:flex;align-items:baseline;gap:8px;font-size:12.5px;color:var(--faint);padding-bottom:6px}
.sec-title .grow{flex:1}
.quiet-line{padding:12px 0;border-top:1px solid var(--border);color:var(--faint);font-size:13.5px}
.intro{font-size:13px;color:var(--mfg);padding:0 0 8px;max-width:64ch}

/* rows (outline, today) */
.row{display:grid;grid-template-columns:16px minmax(0,1fr) auto;column-gap:10px;align-items:center;padding:11px 10px;margin:0 -10px;border-top:1px solid var(--border);cursor:pointer}
.row:hover,.row.hl{background:var(--hl);border-radius:8px;border-top-color:transparent}
.row:hover+.row,.row.hl+.row{border-top-color:transparent}
.row .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12.5px;white-space:nowrap}
.row .m{grid-column:2/4;font-size:13px;color:var(--mfg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.row .m span{overflow:hidden;text-overflow:ellipsis}
.row.open{background:var(--hl);border-radius:10px 10px 0 0;border-top-color:transparent}
.row.open+.expand+.row{border-top-color:transparent}
.tone-needs{color:var(--needs-ink)}.tone-ok{color:var(--ok-ink)}.tone-quiet{color:var(--mfg)}.tone-faint{color:var(--faint)}
.expand{margin:0 -10px;padding:4px 10px 18px 36px;background:var(--hl);border-radius:0 0 10px 10px}
.subhead{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--mfg);padding:16px 0 4px;font-weight:500}
.subhead .n{color:var(--faint);font-weight:400}
.subhead .w{color:var(--faint);font-weight:400}

.count{font-size:11.5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--needs-soft);color:var(--needs-ink);display:inline-grid;place-items:center;font-weight:600;margin-left:6px}
.nav button{display:flex;align-items:center}
.row.sel{background:var(--sel);border-radius:8px;border-top-color:transparent}
.row.static{cursor:default}
.panel{border:1px solid var(--border);border-radius:12px;padding:18px 20px;margin-top:20px;background:var(--card)}
.panel.soft{background:var(--muted);border-color:transparent}
.panel.needs{background:var(--needs-soft);border-color:transparent}
.panel h3+p{margin-top:4px}
.banner{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--mfg);padding:10px 12px;border-radius:9px;background:var(--muted);margin-top:16px}
.banner .mk{margin-top:2px;flex:none}
.ev{display:grid;grid-template-columns:16px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--border);cursor:pointer;color:var(--fg)}
.ev:first-of-type{border-top:0}
.ev:hover .l{text-decoration:underline}
.ev .ic{color:var(--mfg)}
.ev .r{font-size:12.5px}

/* marks and icons */
.mk{width:16px;height:16px;display:block;flex:none}
.ic{width:14px;height:14px;display:inline-block;flex:none;vertical-align:-2px}

/* controls */
.btn{height:30px;padding:0 12px;border-radius:7px;border:1px solid var(--border2);background:var(--card);cursor:pointer;font-size:13.5px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--muted)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--onprimary);font-weight:500}

.link{border:0;background:none;padding:0;color:var(--primary);cursor:pointer;font-size:inherit;text-align:left}
.link:hover{text-decoration:underline}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.kbd{font-size:11px;color:var(--faint);border:1px solid var(--border2);border-radius:4px;padding:0 4px;margin-left:2px}
textarea{width:100%;border:1px solid var(--border2);background:var(--card);border-radius:8px;padding:9px 11px;resize:vertical;min-height:40px;line-height:1.45}
textarea:focus{border-color:var(--primary);outline:none}

/* record (shared inspector / expanded row content) */
.rec .q{font-size:15px;line-height:1.5;margin-top:4px}
.rec .kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px 16px;margin-top:12px;font-size:14px}

.rec .what .ic{margin-top:3px}
.rec .note{font-size:12.5px;color:var(--faint);margin-top:6px}

/* map (A) */
.legend{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:18px}
.chipbtn{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:5px 10px;border-radius:7px;cursor:pointer;color:var(--mfg);font-size:13.5px}
.chipbtn:hover{background:var(--hl)}
.chipbtn.on{background:var(--hl);color:var(--fg);font-weight:500}
.legend .lbl{font-size:12.5px;color:var(--faint);margin-right:4px}
.lines{display:flex;gap:16px;align-items:center;font-size:12.5px;color:var(--faint);margin-left:10px}
.lines svg{width:30px;height:8px;vertical-align:middle;margin-right:4px}
.mapgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;margin-top:14px;align-items:start}
.mapgrid.insp-on{grid-template-columns:minmax(0,1fr) 352px}
.cwrap{overflow:auto;margin:0 -8px}
.canvas{position:relative;margin:10px 8px 20px}
.colh{position:absolute;top:0;font-size:12.5px;color:var(--faint);display:flex;gap:6px;white-space:nowrap}
.colh b{font-weight:500;color:var(--mfg)}
.edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.e{fill:none;stroke-width:1.4;transition:opacity .18s,stroke .18s}
.e-wait{stroke:var(--mfg);marker-end:url(#a-wait)}
.e-done{stroke:var(--border2);marker-end:url(#a-done)}
.e-fog{stroke:var(--faint);stroke-dasharray:1.5 4;stroke-linecap:round;marker-end:url(#a-done)}

.tracing .e{opacity:.15}
.tracing .e.rel{opacity:1;stroke:var(--primary);marker-end:url(#a-rel)}
.node{position:absolute;width:176px;height:78px;padding:9px 11px;border-radius:10px;border:0;background:var(--muted);cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:2px;transition:opacity .18s,box-shadow .18s,background .18s;text-align:left}
.node:hover{box-shadow:inset 0 0 0 1px var(--border2)}
.node .nk{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--faint)}
.node .nt{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node .ns{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--mfg);white-space:nowrap;overflow:hidden}
.node .ns span{overflow:hidden;text-overflow:ellipsis}
.node .ns .mk{width:12px;height:12px}
.node.settled{background:transparent;box-shadow:inset 0 0 0 1px var(--border)}
.node.settled:hover{background:var(--hl)}
.node.settled .nt{color:var(--mfg);font-weight:400}
.node.settled{height:58px}
.node.settled .nt{display:flex;align-items:center;gap:6px}
.node.settled .nt .ic{color:var(--faint)}
.node.settled .nt span{overflow:hidden;text-overflow:ellipsis}
.node.needs{background:var(--needs-soft)}
.node.fog{background:transparent;border:1px dashed var(--border2)}
.node.fog .nt{font-weight:400}
.node.ghost{height:56px;opacity:.7;border-style:dotted;background:transparent}
.node.ghost .nt{font-size:13px;color:var(--mfg)}

.node.hl{outline:2px solid color-mix(in srgb,var(--primary) 40%,transparent);outline-offset:2px}
.tracing .node{opacity:.3}
.tracing .node.rel{opacity:1}
.tracing .node.ghost.rel{opacity:.85}
.dest{position:absolute;width:196px;border-radius:12px;border:0;background:var(--muted);padding:14px 14px 12px;display:flex;flex-direction:column;gap:8px;transition:opacity .18s}
.dest .nk{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--faint)}
.dest .dt{font-size:14px;line-height:1.45}
.dest .stage{font-size:12.5px;color:var(--mfg);display:flex;gap:6px;align-items:center}
.dest .tasks{border-top:1px solid var(--border);padding-top:8px;display:grid;gap:2px}
.dest .tk{display:grid;grid-template-columns:14px minmax(0,1fr);gap:7px;align-items:start;font-size:13px;padding:5px 6px;margin:0 -6px;border-radius:7px;border:0;background:none;cursor:pointer;text-align:left;transition:opacity .18s}
.dest .tk:hover{background:var(--hl)}
.dest .tk.sel{background:var(--sel)}
.dest .tk .ic{margin-top:3px}
.dest .tk small{display:block;color:var(--faint);font-size:11.5px}
.tracing .dest .tk{opacity:.35}
.tracing .dest .tk.rel{opacity:1}
.insp{position:sticky;top:64px;border:0;border-radius:12px;background:var(--muted);padding:16px 18px 18px;max-height:calc(100vh - 150px);overflow:auto}
.insp .x{float:right;border:0;background:none;cursor:pointer;color:var(--mfg);width:26px;height:26px;border-radius:6px;font-size:16px}
.insp .x:hover{background:var(--hl)}
.insp .kl{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--faint)}
.insp h2{margin-top:4px}
.insp .banner{background:var(--card)}
.insp-empty{font-size:13.5px;color:var(--faint);padding:4px 0}

/* source page */
.revs{display:grid;gap:10px;margin-top:16px}
.rev{border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.rev .k{font-size:12.5px;color:var(--faint);margin-bottom:3px}
.rev.now{border-color:color-mix(in srgb,var(--needs) 45%,transparent)}
.body p{margin-top:10px;max-width:64ch}

/* interview modal */
.scrim{position:fixed;inset:0;background:rgba(15,20,30,.28);display:grid;place-items:center;z-index:20;padding:24px}

.modal .actions{justify-content:flex-end}
.pips{display:flex;gap:4px;margin:10px 0 2px}

.pips i.done{background:var(--faint)}
.pips i.cur{background:var(--primary)}
.choice{display:grid;grid-template-columns:22px 1fr;gap:2px 10px;width:100%;text-align:left;border:1px solid var(--border);background:var(--card);border-radius:10px;padding:10px 12px;margin-top:8px;cursor:pointer}
.choice:hover{border-color:var(--border2)}

.choice .n{width:20px;height:20px;border-radius:5px;border:1px solid var(--border2);display:grid;place-items:center;font-size:11.5px;color:var(--mfg);margin-top:1px}

.rec-b{font-size:11.5px;font-weight:500;color:var(--ok-ink);background:var(--ok-soft);border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:1px}
details summary{cursor:pointer;color:var(--mfg);font-size:13.5px;margin-top:8px}

/* rounds (C): one row per planning round */
.rintro{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;font-size:13px;color:var(--mfg);margin-top:18px}
.rwrap{position:relative;container-type:inline-size;min-width:0}
.rlines{z-index:0}
.rl{fill:none;stroke:var(--border2);stroke-width:1.4;marker-end:url(#r-a);transition:opacity .18s,stroke .18s}
.tracing .rl{opacity:.12}
.tracing .rl.rel{opacity:1;stroke:var(--primary);marker-end:url(#r-rel)}
@media (prefers-reduced-motion:no-preference){
	.rl.new{stroke-dasharray:1 1;stroke-dashoffset:1;animation:draw .7s .12s cubic-bezier(.3,.6,.2,1) forwards}
	@keyframes draw{to{stroke-dashoffset:0}}
	.rnd.rnew{animation:rowin .34s cubic-bezier(.2,.7,.2,1)}
	@keyframes rowin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
}
.rhead,.rnd{display:grid;grid-template-columns:96px minmax(0,1fr) minmax(0,1.15fr) minmax(0,1fr);column-gap:18px}
.rhead{position:sticky;top:48px;z-index:3;background:var(--bg);font-size:12.5px;color:var(--faint);padding:10px 0 7px;border-bottom:1px solid var(--border)}

.rnd+.rnd{border-top:1px solid var(--border)}

.rg .rn{font-size:13px;font-weight:600;color:var(--fg)}
.rg::before{content:"";position:absolute;left:8px;top:18px;bottom:-41px;width:0;border-left:1.5px solid var(--border2)}
.rnd.now .rg::before{border-left-style:dashed}
.rdest .rg::before{display:none}
.rdot{position:absolute;left:3px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:1.5px solid var(--faint);z-index:1}

.nowb{font-size:11.5px;font-weight:500;color:var(--progress);background:color-mix(in srgb,var(--progress) 13%,transparent);border-radius:5px;padding:1px 6px;flex:none}
.rcol{grid-row:2;display:grid;gap:6px;align-content:start;min-width:0}
.rcol::before{display:none;content:attr(data-l);font-size:12px;color:var(--faint)}
.rnone{font-size:12.5px;color:var(--faint);padding:7px 0}
.chip{position:relative;z-index:1;display:grid;grid-template-columns:16px minmax(0,1fr);gap:8px;align-items:start;width:100%;text-align:left;border:0;border-radius:9px;padding:7px 10px;background:var(--muted);cursor:pointer;font-size:13.5px;line-height:1.35;transition:opacity .18s,box-shadow .18s,background .18s}

.chip>.ic{color:var(--mfg)}

.tracing .chip{opacity:.34}

@container (max-width:760px){

	.rflag{left:-1px;top:0}
	.rtop{grid-row:2;grid-column:1/4}

}

/* expedition (D): the same map drawn as an expedition chart. Its own look stays inside the chart. */
:root{--ch-paper:#e9ede0;--ch-ink:#2d3943;--ch-faint:#71807b;--ch-land:#d0d9b8;--ch-hatch:rgba(45,57,67,.2);--ch-contour:#9fb4ad;--ch-fog:#f7f8f2;--ch-route:#ad432a;--ch-serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif}
@media (prefers-color-scheme:dark){:root{--ch-paper:#1c2325;--ch-ink:#cbd4ca;--ch-faint:#87958f;--ch-land:#2d3a31;--ch-hatch:rgba(203,212,202,.14);--ch-contour:#3a4d4b;--ch-fog:#333b3e;--ch-route:#e3825f}}
.xpwrap{position:relative;margin-top:20px}
.xpframe{overflow-x:auto;overflow-y:hidden;border-radius:14px;background:var(--ch-paper);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ch-ink) 22%,transparent)}
.xpchart{position:relative;width:100%;min-width:860px;aspect-ratio:12/7;container-type:inline-size;color:var(--ch-ink);font-size:clamp(11px,1.1cqw,14px);line-height:1.25}
.xpsvg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:hidden}
.xpsvg text{paint-order:stroke;stroke:var(--ch-paper);stroke-width:3px;stroke-linejoin:round}
.xpsvg .ct1{font:500 23px var(--ch-serif);fill:var(--ch-ink)}
.xpsvg .ct2{font:italic 15px var(--ch-serif);fill:var(--ch-ink)}
.xpsvg .ct3{font:italic 13.5px var(--ch-serif);fill:var(--ch-faint)}
.xpsvg .xcap{font:italic 14px var(--ch-serif);fill:var(--ch-faint)}
.xpsvg .xz{font:italic 600 12px var(--ch-serif);fill:var(--ch-faint);stroke:none}
.xgrat{fill:none;stroke:var(--ch-contour);stroke-width:.6;opacity:.5}
.xring{fill:none;stroke:var(--ch-faint);stroke-width:1.5;stroke-dasharray:1.5 6;stroke-linecap:round}
.xtr{fill:none;stroke:var(--ch-ink);stroke-width:1.6;opacity:.6;marker-end:url(#xp-ar);transition:opacity .18s,stroke .18s}
.xtr-wait,.xtr-fog{stroke-dasharray:.5 6;stroke-linecap:round;stroke-width:2.3;opacity:.75}
.xtr-fog{stroke:var(--ch-faint)}
.xroute{fill:none;stroke:var(--ch-route);stroke-width:2.4;stroke-dasharray:8 6;stroke-linecap:round;opacity:.9}
.needle{transform-box:fill-box;transform-origin:center}
.xp-pl,.xp-fog,.xp-camp,.xp-db,.xp-tk{transition:opacity .18s}
.xpchart.tracing .xtr{opacity:.12}
.xpchart.tracing .xtr.rel{opacity:1;stroke:var(--primary);marker-end:url(#xp-ar-rel)}
.xpchart.tracing .xp-pl,.xpchart.tracing .xp-fog,.xpchart.tracing .xp-camp,.xpchart.tracing .xp-db,.xpchart.tracing .xp-tk{opacity:.3}
.xpchart.tracing .rel{opacity:1}
.xp-pl{--g:clamp(18px,1.9cqw,24px);position:absolute;z-index:2;display:flex;align-items:center;gap:.45em;transform:translate(calc(var(--g) / -2),-50%);max-width:16cqw;border:0;background:none;padding:2px 6px 2px 0;border-radius:999px 9px 9px 999px;color:inherit;text-align:left;cursor:pointer}
.xgw{width:var(--g);height:var(--g);flex:none;display:grid;place-items:center;border-radius:50%;background:var(--ch-paper);border:1px solid color-mix(in srgb,var(--ch-ink) 40%,transparent)}
.xg{width:78%;height:78%;display:block}
.xtx{min-width:0;display:grid;text-shadow:0 0 2px var(--ch-paper),0 0 3px var(--ch-paper),0 0 6px var(--ch-paper)}
.xt{font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.xs{font-size:.86em;color:var(--ch-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xs.tone-needs{color:var(--needs-ink);font-weight:500}
.xp-pl.done .xgw{background:var(--ch-land)}
.xp-pl.done .xt{font-weight:500}
.xp-pl.needs .xgw{background:var(--needs-soft);border-color:var(--needs);box-shadow:0 0 0 5px color-mix(in srgb,var(--needs) 22%,transparent)}
.xp-pl.run .xgw{border-color:var(--progress)}
.xp-pl.wait .xgw{border-style:dashed}
.xp-pl.wait .xt{font-weight:500;color:var(--ch-faint)}
.xp-pl:hover .xt,.xp-db:hover .dk,.xp-tk:hover .tt,.xp-fog:hover .ft,.xp-fog.gone:hover .fk{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px}
.xp-pl.sel .xgw,.xp-camp.sel,.xp-tk.sel .xgw{outline:2px solid var(--primary);outline-offset:2px}
.xp-pl.sel .xt,.xp-fog.sel .ft,.xp-fog.gone.sel .fk,.xp-db.sel .dk,.xp-tk.sel .tt{color:var(--primary)}
.xpchart .hl{outline:2px solid color-mix(in srgb,var(--primary) 45%,transparent);outline-offset:3px}
.xp-fog{position:absolute;z-index:2;transform:translate(-50%,-50%);display:grid;justify-items:center;max-width:15cqw;border:0;background:none;padding:4px 8px;border-radius:12px;color:var(--ch-ink);text-align:center;cursor:pointer;font-family:var(--ch-serif);text-shadow:0 0 3px var(--ch-fog),0 0 6px var(--ch-fog)}
.xp-fog .fk{font-size:.84em;font-style:italic;color:var(--ch-faint)}
.xp-fog .ft{font-size:1.2em;font-style:italic;line-height:1.15}
.xp-fog .fs{font:.84em/1.3 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:var(--ch-faint);margin-top:2px}
.xp-fog.gone{max-width:22cqw;text-shadow:0 0 3px var(--ch-paper),0 0 6px var(--ch-paper)}
.xp-fog.gone .fk{font-size:.92em;white-space:nowrap}
.xp-camp{--c:clamp(19px,2cqw,26px);position:absolute;z-index:3;transform:translate(-50%,-50%);width:var(--c);height:var(--c);padding:0;border-radius:50%;border:1.6px solid var(--ch-route);background:var(--ch-paper);color:var(--ch-route);font:600 .92em/1 var(--ch-serif);display:grid;place-items:center;cursor:pointer}
.xp-camp.now{background:var(--ch-route);color:var(--ch-paper)}
.xp-camp .here{position:absolute;left:calc(100% + 5px);top:50%;transform:translateY(-50%);white-space:nowrap;font:italic 500 1em var(--ch-serif);color:var(--ch-route);text-shadow:0 0 2px var(--ch-paper),0 0 4px var(--ch-paper)}
.xp-camp.lft .here{left:auto;right:calc(100% + 5px)}
.xp-comp{position:absolute;z-index:2;transform:translate(-50%,-50%);width:8cqw;height:8cqw;border-radius:50%;border:0;background:none;cursor:pointer;padding:0}
.xp-dest{position:absolute;z-index:2;transform:translateX(-50%);width:17cqw;display:grid;gap:.6em;justify-items:start}
.xp-db{display:grid;gap:.25em;border:0;background:none;padding:5px 7px;margin:-5px -7px;border-radius:9px;color:inherit;text-align:left;cursor:pointer;text-shadow:0 0 3px var(--ch-paper)}
.xp-db .dk{font:italic 1.25em var(--ch-serif)}
.xp-db .dd{font-size:.95em}
.xp-db .dg,.xp-tasks .dg{font-size:.86em;color:var(--ch-faint)}
.xp-tasks{display:grid;gap:1px;width:100%;border-top:1px solid color-mix(in srgb,var(--ch-ink) 25%,transparent);padding-top:.5em}
.xp-tasks .tk-h{font:italic 1em var(--ch-serif);color:var(--ch-faint);margin-bottom:.2em}
.xp-tk{--g:clamp(16px,1.6cqw,20px);display:grid;grid-template-columns:var(--g) minmax(0,1fr);gap:.5em;align-items:center;border:0;background:none;padding:3px 5px;margin:0 -5px;border-radius:7px;color:inherit;text-align:left;cursor:pointer}
.xp-tk .xgw{border:0;background:none}
.xp-tk .tt{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.92em}
.xp-tk .ts{display:block;font-size:.8em;color:var(--ch-faint)}
.xpncol{position:absolute;top:14px;bottom:14px;width:344px;z-index:4;pointer-events:none}
.xpncol.r{right:14px}
.xpncol.l{left:14px}
.xpnotes{top:62px;max-height:calc(100vh - 150px);background:var(--card);box-shadow:var(--shadow);pointer-events:auto}
.xpnotes h2{font:500 20px/1.25 var(--ch-serif)}
.xphint{display:none;font-size:12.5px;color:var(--faint);margin-top:8px}
.xpbelow{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr) minmax(0,.85fr);gap:0 36px}
.lgn{width:18px;height:18px;border-radius:50%;border:1.4px solid var(--ch-route);color:var(--ch-route);font:600 11px/1 var(--ch-serif);display:grid;place-items:center;margin-left:-1px}
.lgn.now{background:var(--ch-route);color:var(--ch-paper)}
.xkey{list-style:none;margin:0;padding:6px 0 0;display:grid;gap:9px;font-size:13px;color:var(--mfg)}
.xkey li{--g:22px;display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:center}
.xkey .xgw{background:var(--ch-paper)}
.xkey svg.sw{width:26px;height:14px;display:block}
.drawer .cmp{border-top:1px solid rgba(255,255,255,.1);padding:8px 0 6px;margin-top:6px}

.drawer .ca{color:var(--proto-faint);font-size:12.5px;padding:1px 0}
.drawer .ca b{font-weight:500}
.drawer .ca.on{color:#fff}
@media (prefers-reduced-motion:no-preference){
	.isl.grow{transform-box:fill-box;transform-origin:center;animation:xgrow .9s cubic-bezier(.2,.7,.2,1) both}
	@keyframes xgrow{from{transform:scale(.25);opacity:0}to{transform:none;opacity:1}}
	.fogc.lift{transform-box:fill-box;transform-origin:center;animation:xlift 1.1s ease-out both}

}

</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div id="drawer"></div>
<div id="modal"></div>
<div id="bar"></div>
<script>

/* ==========================================================================
   Pure model. No DOM. Liftable: (state, action) => state, plus selectors.
   Field names follow the native read model (apps/day/native/src/plan.rs):
   Exploration {kind: grilling|research|prototype, state: waiting|ready|running|asking|resolved,
   after, by, result, sources, fromFog, round, evidence, observations, unresolved, changed},
   FogArea {area, why, readyWhen, after, sources, active, became}, MapInfo {revision, agreement, tasks}.
   "lane" is presentation only.
   ========================================================================== */
const Model = (() => {
	const START = 14 * 60 + 5;
	const clock = (m) => Math.floor(m / 60) + ":" + String(m % 60).padStart(2, "0");
	const DESTINATION = "Pilot runs on Linux with the same Today and planning as on macOS.";
	const KIND = {
		grilling: { name: "Interview", need: "Needs your answers", what: "A choice only you make. Pilot asks it in a saved interview and never answers for you." },
		research: { name: "Research", need: "Needs research", what: "An agent looks for evidence. Findings are saved as Knowledge. They are not your decisions." },
		prototype: { name: "Prototype", need: "Needs a prototype", what: "A small, throwaway experiment. Its finding is evidence. It is not acceptance and gives no permission to build." },
	};
	const opt = (k, l, rec) => ({ k, l, rec: !!rec });
	const ASKS = {
		scope: [
			{ id: "n1", prompt: "What would make this worth doing?", options: [opt("a", "It saves you time every week", 1), opt("b", "It unblocks other work"), opt("c", "Someone asked for it")] },
			{ id: "n2", prompt: "What should Pilot leave out for now?", options: [opt("a", "Anything beyond a first working version", 1), opt("b", "Nothing. Do it fully")] },
			{ id: "n3", prompt: "What must not change?", options: [opt("a", "Existing behavior and saved data", 1), opt("b", "Nothing in particular")] },
			{ id: "n4", prompt: "How will you check that it is done?", options: [opt("a", "A short demo you can try yourself", 1), opt("b", "Passing checks are enough")] },
			{ id: "n5", prompt: "May Pilot open a pull request when it is done?", options: [opt("a", "Yes, and wait for my review", 1), opt("b", "No, keep it local until I say")] },
		],
		desktops: [
			{ id: "first", prompt: "Which desktops must work on the first day?", why: "Each desktop shows windows, notifications and status a little differently. Fewer desktops means an earlier first version.", options: [opt("gnome-kde", "GNOME and KDE", 1), opt("gnome", "GNOME only"), opt("any", "Any Wayland desktop")] },
			{ id: "working", prompt: "What counts as working?", why: "This sets the bar for the first version and what Pilot leaves for later.", options: [opt("core", "Today, New and chats work; no tray icon", 1), opt("all", "Everything the Mac app has")] },
			{ id: "packages", prompt: "May Pilot use packages made for one distribution?", why: "One portable package is simpler to update. Packages per distribution feel more native but cost more to keep.", options: [opt("portable", "No. One portable package", 1), opt("each", "Yes, one per distribution")] },
		],
		updates: [
			{ id: "upd", prompt: "How should Linux users get updates?", why: "Research found one portable package works. Pilot can update it itself, or leave updates to the system.", options: [opt("self", "Pilot updates itself, as on macOS", 1), opt("system", "Leave updates to the package manager")] },
		],
		"status-choice": [
			{ id: "notify", prompt: "Is a status line enough, or do you also want a notification?", why: "The prototype showed the status line stays readable. It cannot tell whether you notice it when the window is hidden.", options: [opt("both", "Status line, plus a notification when something needs you", 1), opt("line", "Status line only")] },
		],
	};
	const NEW = {
		"status-choice": { id: "status-choice", lane: 7, kind: "grilling", title: "Status line or notification", question: "Is a status line enough, or do you also want a notification when something needs you?", after: ["status-line"], refs: ["proto-status"] },
	};
	const FINISH = {
		tray: { result: "Answered by Knowledge: Status without a tray, revision 1. Not checked by Pilot.",
			source: { id: "k-tray", kind: "knowledge", title: "Status without a tray", rev: 1, check: "Not checked by Pilot", by: "Research chat", body: ["GNOME hides tray icons unless an extension is installed. KDE shows them.", "A status line inside the window and desktop notifications work on both without extensions."], cites: ["GNOME Shell extension documentation (web)", "KDE status notifier documentation (web)"] } },
		packaging: { result: "Answered by Knowledge: Linux packages, revision 1. Not checked by Pilot.",
			source: { id: "k-packaging", kind: "knowledge", title: "Linux packages", rev: 1, check: "Not checked by Pilot", by: "Research chat", body: ["Mock finding. One portable package ran on the four distributions tried.", "Packages for each distribution would need their own build and signing steps."], cites: ["NSH 0.4 packaging guide (repository)", "Distribution packaging notes (web)"] } },
		"screen-reader": { result: "Answered by Knowledge: Screen readers on Wayland, revision 1. Not checked by Pilot.",
			source: { id: "k-a11y", kind: "knowledge", title: "Screen readers on Wayland", rev: 1, check: "Not checked by Pilot", by: "Research chat", body: ["Mock finding. Orca reads the tried native windows on GNOME.", "KDE was not tried. The finding says so; Pilot does not assume it works there."], cites: ["Orca documentation (web)"] } },
		"offline-install": { result: "Answered by Knowledge: Installing with no network, revision 1. Not checked by Pilot.",
			source: { id: "k-offline", kind: "knowledge", title: "Installing with no network", rev: 1, check: "Not checked by Pilot", by: "Research chat", body: ["Mock finding. The portable package installs from a file.", "Updates wait until the machine is online."], cites: ["Linux packages, revision 1 (Knowledge)"] } },
	};
	const SLICES = [
		{ title: "Linux build with one portable package", owner: "Backend (Sol)", from: ["scope", "packaging", "wayland"] },
		{ title: "Status line and notifications on GNOME and KDE", owner: "UI (Opus)", from: ["desktops", "tray", "status-line", "status-choice", "screen-reader"] },
		{ title: "Read the daemon token from the keyring", owner: "Backend (Sol)", from: ["keyring"] },
		{ title: "Self-update for the portable package", owner: "Backend (Sol)", from: ["updates", "packaging"] },
	];

	const ex = (p) => Object.assign({ after: [], by: "", result: "", refs: [], fromFog: "", round: "", evidence: "", observations: [], unresolved: [], changed: [], lane: 0 }, p);
	const withItem = (asks, item) => asks.map((q) => Object.assign({}, q, { item }));

	/* Planning rounds: each time Pilot updates the map from something new, one row of history.
	   explored: what the round looked at. out: what it produced, each with its source record and what it changed.
	   next: the next steps it set up, frozen when the next round starts (the latest round's are live). */
	const out = (n, i, o) => Object.assign({ k: "o" + n + "-" + i, about: "", ids: [], src: "", rev: 0, meta: "", changed: [] }, o);
	const pass = (n, at, title, icon, explored, outs, next, rev) => ({ n, at, title, icon, explored, out: outs.map((o, i) => out(n, i, o)), next, rev });
	const step = (ids, title, who, mk) => ({ ids, title, who, mk });
	function history() {
		return [
			pass(1, "Nov 8", "You wrote the brief", "brief", ["src:brief-1"], [
				{ kind: "question", about: "scope", label: "A port, not a new app", meta: "Interview question", src: "brief-1", changed: ["Added \u201cA port, not a new app\u201d for your first interview."] },
				{ kind: "question", about: "wayland", label: "Wayland or X11", meta: "Interview question", src: "brief-1", changed: ["Added \u201cWayland or X11\u201d. Only you can choose it."] },
				{ kind: "fog", about: "fog:credentials", label: "Where credentials live", meta: "Fog of war", src: "brief-1", changed: ["Marked \u201cWhere credentials live\u201d as fog: not clear enough to ask about yet."] },
				{ kind: "fog", about: "fog:a11y", label: "Accessibility on Linux", meta: "Fog of war", src: "brief-1", changed: ["Marked \u201cAccessibility on Linux\u201d as fog. It waits until the desktops are chosen."] },
			], [step(["scope", "wayland"], "Answer interview round 1", "You", "needs"), step(["fog:credentials"], "Explores \u201cWhere credentials live\u201d", "Pilot", "ready")], 1),
			pass(2, "Nov 9", "Your interview round 1 answers", "round", ["scope", "wayland", "fog:credentials"], [
				{ kind: "answer", about: "scope", label: "The same app, a first working version", meta: "Your answers \u00b7 interview round 1", src: "round-1", changed: ["Settled \u201cA port, not a new app\u201d.", "Anything beyond a first working version is left out for now."] },
				{ kind: "decision", about: "wayland", label: "Decision 4: Wayland first", meta: "Revision 2", src: "d4", rev: 2, changed: ["Settled \u201cWayland or X11\u201d: Wayland only in the first version."] },
				{ kind: "question", about: "keyring", label: "Keyring access", meta: "Research \u00b7 was fog", src: "brief-1", changed: ["Fog \u201cWhere credentials live\u201d became the precise question \u201cKeyring access\u201d. The fog is kept as history."] },
				{ kind: "question", about: "desktops", label: "Which desktops count", meta: "Interview question", src: "brief-1", changed: ["Added \u201cWhich desktops count\u201d. Only you can choose it."] },
				{ kind: "question", about: "packaging", label: "Packaging formats", meta: "Research question", src: "round-1", changed: ["Added \u201cPackaging formats\u201d: your demo needs a build you can install."] },
				{ kind: "question", about: "tray", label: "Status without a tray", meta: "Research question", src: "d4", changed: ["Added \u201cStatus without a tray\u201d: some Wayland desktops hide tray icons."] },
				{ kind: "fog", about: "fog:offline", label: "Installing without a network", meta: "Fog of war", src: "round-1", changed: ["Marked \u201cInstalling without a network\u201d as fog. It waits for the packaging formats."] },
			], [step(["keyring"], "\u201cKeyring access\u201d is ready for research", "Pilot", "ready"), step(["desktops"], "Asks you about \u201cWhich desktops count\u201d", "Pilot", "ready"), step(["tray"], "\u201cStatus without a tray\u201d is ready for research", "Pilot", "ready"), step(["packaging"], "\u201cPackaging formats\u201d is ready for research", "Pilot", "ready")], 3),
			pass(3, "Nov 10", "Research came back: Keyring access", "research", ["keyring", "desktops"], [
				{ kind: "knowledge", about: "keyring", label: "Knowledge: Linux keyring access", meta: "Revision 3 \u00b7 not checked by Pilot", src: "k-keyring", changed: ["Settled \u201cKeyring access\u201d: the keyring holds the token, and Pilot never writes it to disk."] },
				{ kind: "question", about: "updates", label: "How updates arrive", meta: "Interview question \u00b7 waits for Packaging formats", src: "brief-1", changed: ["Added \u201cHow updates arrive\u201d. It waits for \u201cPackaging formats\u201d."] },
				{ kind: "question", about: "status-line", label: "A status line instead of a tray", meta: "Prototype", src: "brief-1", changed: ["Added a prototype, so you can react to a status line while research runs."] },
				{ kind: "interview", about: "desktops", label: "Saved interview round 2", meta: "3 questions, all up front", changed: ["\u201cWhich desktops count\u201d asks you."] },
			], null, 6),
		];
	}
	function snapNext(s) {
		return nextSteps(s).map((st) => step(st.ids || (st.id ? [st.id] : []), st.title, st.who, st.you ? "needs" : st.running ? "running" : st.later ? "waiting" : "ready"));
	}
	/* A new round starts when something new arrives. The previous round's next steps are kept as they were. */
	function openPass(s, title, icon, explored) {
		const last = s.passes[s.passes.length - 1];
		if (last && !last.next) last.next = snapNext(s);
		const n = s.passes.length + 1;
		s.passes.push(pass(n, "Today " + clock(START + s.min), title, icon, explored, [], null, s.revision));
	}
	function addOut(s, o) {
		const p = s.passes[s.passes.length - 1];
		p.out.push(out(p.n, p.out.length, o));
	}
	function explore(s, id) {
		const p = s.passes[s.passes.length - 1];
		if (p.explored.indexOf(id) < 0) p.explored.push(id);
	}
	/* What settling one question changed on the map, in words. */
	function effects(s0, s, id) {
		const q = (t) => "\u201c" + t + "\u201d";
		const out = [];
		const a = get(s0, id), b = get(s, id);
		if (b && b.state === "resolved" && a && a.state !== "resolved") out.push("Settled " + q(b.title) + ".");
		for (const y of s.ex) { const x = get(s0, y.id); if (x && x.state === "waiting" && y.state === "ready" && x.after.indexOf(id) >= 0) out.push(q(y.title) + " no longer waits. It is ready."); }
		for (const f of s.fog) { const x = fogOf(s0, f.id); if (x && x.active && x.after.indexOf(id) >= 0 && !f.after.length) out.push("Fog " + q(f.area) + " is ready to explore."); }
		return out;
	}

	function initial() {
		return {
			min: 0, revision: 6, plan: null, tasks: [], log: [], passes: history(),
			ex: [
				ex({ id: "scope", lane: 0, kind: "grilling", state: "resolved", title: "A port, not a new app", question: "Is Linux the same app on a new platform, or a separate app?", result: "Answered in interview round 1", round: "r1", refs: ["round-1"] }),
				ex({ id: "wayland", lane: 1, kind: "grilling", state: "resolved", title: "Wayland or X11", question: "Must Pilot run on X11 too?", result: "Settled by Decision 4. It changed since.", refs: ["d4"], changed: ["Decision 4 changed after Pilot cited it."] }),
				ex({ id: "desktops", lane: 2, kind: "grilling", state: "asking", title: "Which desktops count", question: "Which Linux desktops must Pilot support first?", refs: ["brief-1"], round: "r2" }),
				ex({ id: "packaging", lane: 3, kind: "research", state: "ready", title: "Packaging formats", question: "Which Linux packages can NSH 0.4 build?" }),
				ex({ id: "updates", lane: 4, kind: "grilling", state: "waiting", title: "How updates arrive", question: "How should Linux users get updates?", after: ["packaging"] }),
				ex({ id: "tray", lane: 5, kind: "research", state: "running", title: "Status without a tray", question: "Can Pilot show its status on GNOME without a tray icon?", by: "A research chat, started 12 min ago", refs: ["chat-tray"] }),
				ex({ id: "status-line", lane: 6, kind: "prototype", state: "ready", title: "A status line instead of a tray", question: "Is a status line in the window enough when there is no tray?" }),
				ex({ id: "keyring", lane: 8, kind: "research", state: "resolved", title: "Keyring access", question: "Can Pilot read the daemon's token from the desktop keyring?", result: "Answered by Knowledge: Linux keyring access, revision 3. Not checked by Pilot.", refs: ["k-keyring"], fromFog: "credentials" }),
			],
			fog: [
				{ id: "a11y", lane: 2, area: "Accessibility on Linux", why: "Screen reader support differs between desktops.", readyWhen: "Once the desktops are chosen.", readyNow: "Ready to explore: the desktops are chosen.", after: ["desktops"], refs: ["brief-1"], active: true, became: [],
					graduates: { id: "screen-reader", lane: 2.5, kind: "research", title: "Screen readers on Wayland", question: "Does the Linux screen reader read Pilot's native windows on GNOME and KDE?" } },
				{ id: "offline", lane: 3, area: "Installing without a network", why: "Some people install on machines with no network access.", readyWhen: "Once the packaging formats are known.", readyNow: "Ready to explore: the packaging formats are known.", after: ["packaging"], refs: ["round-1"], active: true, became: [],
					graduates: { id: "offline-install", lane: 3.5, kind: "research", title: "Install from a file", question: "Can the portable package install and run with no network at all?" } },
				{ id: "credentials", lane: 8, area: "Where credentials live", why: "Pilot must reach the daemon without copying its token.", readyWhen: "Ready: it became a research question.", after: [], refs: ["brief-1"], active: false, became: ["keyring"] },
			],
			rounds: [
				{ id: "r1", n: 1, items: ["scope"], asks: withItem(ASKS.scope, "scope"), state: "absorbed", at: "Nov 9",
					answers: { n1: { choice: "b", text: "" }, n2: { choice: "a", text: "" }, n3: { choice: "a", text: "" }, n4: { choice: "a", text: "Try it on my own laptop." }, n5: { choice: "a", text: "" } } },
				{ id: "r2", n: 2, items: ["desktops"], asks: withItem(ASKS.desktops, "desktops"), state: "open", at: "", answers: {} },
			],
			sources: {
				"brief-1": { id: "brief-1", kind: "brief", title: "Brief", rev: 1, by: "You", at: "Nov 8", body: ["Make Pilot work on Linux desktops.", "Same Today and planning as on macOS. Start with the desktops most people use.", "Pilot must reach the daemon without copying its token."] },
				d4: { id: "d4", kind: "decision", number: 4, title: "Wayland first", rev: 3, cited: 2, by: "You", at: "Nov 9, changed Nov 11",
					revs: { 2: "Pilot on Linux targets Wayland sessions. X11 is not supported in the first version.", 3: "Pilot on Linux targets Wayland sessions. X11 is not supported in the first version. The file picker may use XWayland." } },
				"k-keyring": { id: "k-keyring", kind: "knowledge", title: "Linux keyring access", rev: 3, check: "Not checked by Pilot", by: "Research chat", at: "Nov 10", body: ["The desktop keyring can hold the daemon token for each user.", "Pilot reads it when it starts and never writes it to disk."], cites: ["Secret Service API documentation (web)", "Daemon token handling (repository)"] },
				"round-1": { id: "round-1", kind: "round", round: "r1" },
				"chat-tray": { id: "chat-tray", kind: "chat", title: "Research chat: Status without a tray", by: "Research chat", at: "started 12 min ago", body: ["Running. Nothing is saved yet.", "When it finishes, its findings are saved as a Knowledge entry and cited here."] },
			},
		};
	}

	const get = (s, id) => s.ex.find((e) => e.id === id) || null;
	const fogOf = (s, id) => s.fog.find((f) => f.id === id) || null;
	const resolved = (s, id) => { const e = get(s, id); return !!e && e.state === "resolved"; };
	const answered = (a) => !!a && (a.choice != null || (a.text || "").trim().length > 0);
	const openRound = (s) => s.rounds.find((r) => r.state === "open" || r.state === "submitted") || null;
	const title = (s, id) => { const e = get(s, id); if (e) return e.title; const f = fogOf(s, id); return f ? f.area : id; };
	const titles = (s, ids) => ids.map((id) => title(s, id)).join(", ");

	function log(s, who, text) { s.log.unshift({ at: clock(START + s.min), who, text }); s.min += 2; }

	function answerWords(r, q) {
		const a = r.answers[q.id];
		if (!a) return "No answer";
		const o = q.options.find((x) => x.k === a.choice);
		const t = (a.text || "").trim();
		return [o ? o.l : "", t ? "\u201c" + t + "\u201d" : ""].filter(Boolean).join(" \u00b7 ") || "No answer";
	}

	function unblock(s) {
		for (const e of s.ex) if (e.state === "waiting" && e.after.every((id) => resolved(s, id))) e.state = "ready";
		for (const f of s.fog) {
			if (!f.active) continue;
			f.after = f.after.filter((id) => !resolved(s, id));
			if (f.after.length === 0 && f.readyNow) f.readyWhen = f.readyNow;
		}
	}

	function reduce(s0, a) {
		const s = step1(s0, a);
		if (s !== s0 && s.passes.length) s.passes[s.passes.length - 1].rev = s.revision;
		return s;
	}
	function step1(s0, a) {
		const s = structuredClone(s0);
		const e = a.id ? get(s, a.id) : null;
		switch (a.type) {
			case "interview/submit": {
				const r = s.rounds.find((x) => x.id === a.round);
				if (!r || r.state !== "open") return s0;
				const ans = a.answers || {};
				if (!r.asks.every((q) => answered(ans[q.id]))) return s0;
				r.answers = {};
				for (const q of r.asks) r.answers[q.id] = { choice: ans[q.id].choice == null ? null : ans[q.id].choice, text: (ans[q.id].text || "").trim() };
				r.state = "submitted"; r.at = clock(START + s.min);
				log(s, "You", "Submitted interview round " + r.n + " (" + r.asks.length + (r.asks.length === 1 ? " answer)" : " answers)"));
				return s;
			}
			case "pilot/absorb": {
				const r = s.rounds.find((x) => x.id === a.round);
				if (!r || r.state !== "submitted") return s0;
				openPass(s, "Your interview round " + r.n + " answers", "round", r.items.slice());
				r.state = "absorbed";
				const src = "round-" + r.n;
				s.sources[src] = { id: src, kind: "round", round: r.id };
				for (const id of r.items) {
					const it = get(s, id);
					const q = r.asks.find((x) => x.item === id);
					it.state = "resolved"; it.round = r.id;
					it.result = "Answered in interview round " + r.n + ": " + answerWords(r, q);
					it.refs = it.refs.concat([src]);
				}
				unblock(s);
				for (const id of r.items) {
					const q = r.asks.find((x) => x.item === id);
					addOut(s, { kind: "answer", about: id, src, label: answerWords(r, q), meta: "Your answer \u00b7 " + title(s, id), changed: effects(s0, s, id) });
				}
				s.revision++;
				log(s, "Pilot", "Updated the map from your round " + r.n + " answers: " + titles(s, r.items) + " is settled");
				return s;
			}
			case "pilot/ask": {
				if (openRound(s)) return s0;
				const bank = s.asks || ASKS;
				const ready = s.ex.filter((x) => x.kind === "grilling" && x.state === "ready" && bank[x.id]);
				if (!ready.length) return s0;
				const n = s.rounds.length + 1;
				const r = { id: "r" + n, n, items: ready.map((x) => x.id), asks: [], state: "open", at: "", answers: {} };
				for (const x of ready) { r.asks = r.asks.concat(withItem(bank[x.id], x.id)); x.state = "asking"; x.round = r.id; }
				s.rounds.push(r);
				for (const x of ready) explore(s, x.id);
				addOut(s, { kind: "interview", about: r.items[0], ids: r.items.slice(), label: "Saved interview round " + n, meta: r.asks.length + " questions, all up front", changed: r.items.map((id) => "\u201c" + title(s, id) + "\u201d asks you.") });
				s.revision++;
				log(s, "Pilot", "Saved interview round " + n + " with " + r.asks.length + " questions, all up front");
				return s;
			}
			case "research/start": {
				if (!e || e.kind !== "research" || e.state !== "ready") return s0;
				e.state = "running"; e.by = "A research chat, started just now";
				const cid = "chat-" + e.id;
				s.sources[cid] = { id: cid, kind: "chat", title: "Research chat: " + e.title, by: "Research chat", at: "started just now", body: ["Running. Nothing is saved yet.", "When it finishes, its findings are saved as a Knowledge entry and cited here."] };
				e.refs = e.refs.concat([cid]);
				s.revision++;
				log(s, "Pilot", "Mission automation started research: " + e.title);
				return s;
			}
			case "research/finish": {

<script>

const W = 176, GAP = 46, H = 78, SH = 58, GH = 56, GY = 18, HEAD = 34, DW = 196;
function layout() {
	const nodes = [];

	for (const f of state.fog) nodes.push({ id: "fog:" + f.id, col: 3, lane: f.lane, h: f.active ? H : GH, ghost: !f.active });
	// Each column stacks its own cards in a stable order (lane), so related cards stay close.
	let bottom = HEAD + 300;
	for (let c = 0; c < 4; c++) {
		const col = nodes.filter((n) => n.col === c).sort((a, b) => (a.ghost ? 1 : 0) - (b.ghost ? 1 : 0) || a.lane - b.lane);
		let y = HEAD;
		for (const n of col) { n.x = c * (W + GAP); n.y = y; y += n.h + GY; }
		bottom = Math.max(bottom, y - GY);

function edgesOf(L) {

	for (const f of state.fog) {
		if (f.active) for (const a of f.after) if (at[a]) out.push({ from: a, to: "fog:" + f.id, cls: "e-fog" });
		if (!f.active) for (const b of f.became) if (at[b]) out.push({ from: "fog:" + f.id, to: b, cls: "e-became", back: true });
	}
	// Lines that share a gap are spread a few pixels apart so they never merge.
	const used = {};

}
function edgePath(a, b, back, used) {

	let g = by < ay ? a.y - GY / 2 : a.y + a.h + GY / 2;
	if (back || b.col - a.col > 1) {
		const k = Math.round(g / 24);
		const n = used[k] || 0;
		used[k] = n + 1;
		g += n % 2 ? -7 * Math.ceil(n / 2) : 7 * Math.ceil(n / 2);
	}
	const P = (pts) => "M" + pts[0] + " " + pts[1] + " C" + pts.slice(2, 8).join(" ") + " L" + pts[8] + " " + pts[9] + " C" + pts.slice(10, 16).join(" ");
	if (back) { const x1 = a.x, x2 = b.x + W + 4; return P([x1, ay, x1 - 14, ay, x1 - 14, g, x1 - 26, g, x2 + 26, g, x2 + 14, g, x2 + 14, by, x2, by]); }
	if (b.col - a.col > 1) { const x1 = a.x + W, x2 = b.x - 4; return P([x1, ay, x1 + 14, ay, x1 + 14, g, x1 + 26, g, x2 - 26, g, x2 - 14, g, x2 - 14, by, x2, by]); }
	if (a.col === b.col) { const x = a.x, x2 = b.x - 4; return "M" + x + " " + ay + " C" + (x - 30) + " " + ay + " " + (x2 - 26) + " " + by + " " + x2 + " " + by; }

function traceD(id) {
	if (state.meta) return traceBig(id);
	const c = document.getElementById("xpchart");
	if (!c) return;
	let set = null;
	if (id && id.indexOf("camp:") === 0) {
		const p = state.passes.find((x) => "camp:" + x.n === id);
		if (p) set = new Set([id].concat(p.explored.map((x) => (x.indexOf("src:") === 0 ? "home" : x))));
	} else if (id && id.indexOf("out:") === 0) {
		const r = passOut(id);
		if (r) set = new Set(outIds(r.o).concat(["camp:" + r.p.n]));
	} else if (id && id !== "dest" && id !== "home" && exists(id)) {
		set = related(id);
		for (const p of state.passes) if (p.explored.indexOf(id) >= 0) set.add("camp:" + p.n);
	}
	c.classList.toggle("tracing", !!set);
	for (const el of c.querySelectorAll("[data-node]")) el.classList.toggle("rel", !!set && set.has(el.dataset.node));
	for (const el of c.querySelectorAll(".xtr")) el.classList.toggle("rel", !!set && set.has(el.dataset.from) && set.has(el.dataset.to));
}

function inText(e) { const t = e.target; return t && (t.tagName === "TEXTAREA" || (t.tagName === "INPUT" && t.type === "text") || t.isContentEditable); }
document.addEventListener("keydown", (e) => {
	if (ui.modal && ui.modal.kind === "interview" && e.key === "Enter" && (e.metaKey || e.ctrlKey)) { act({ dataset: { act: "ivSubmit" } }, e); e.preventDefault(); return; }
	if (e.key === "Escape") {
		if (inText(e)) { e.target.blur(); return; }
		if (ui.modal) { ui.modal = null; render(); e.preventDefault(); return; }
		if (ui.kind) { ui.kind = null; render(); return; }
		if (ui.sel && ui.route.name === "map") { ui.open[ui.sel] = false; ui.sel = null; render(); return; }
		if (state.meta && ui.variant === "D" && (ui.bz || ui.cam) && ui.route.name === "map") { ui.bz = null; ui.cam = null; render(); return; }
		goBack(); e.preventDefault(); return;
	}
	if (inText(e)) return;
	if (e.metaKey || e.ctrlKey || e.altKey) return;
	if (!ui.modal && state.meta && ui.variant === "D" && ui.route.name === "map" && document.getElementById("bview") && "+=-_".indexOf(e.key) >= 0) { bigStep(e.key === "+" || e.key === "=" ? 1 : -1); e.preventDefault(); return; }
	if (ui.modal) {
		if (ui.modal.kind !== "interview") return;
		const r = Model.openRound(state);
		if (!r) return;
		if ((e.key === "ArrowLeft" || e.key === "ArrowRight") && !ui.iv.all) { act({ dataset: { act: "ivNav", arg: e.key === "ArrowLeft" ? "-1" : "1" } }, e); e.preventDefault(); return; }
		if (/^[0-9]$/.test(e.key)) {
			const n = +e.key;
			if (n === 0) { const d = $modal.querySelector("details[data-why]"); if (d) d.open = !d.open; return; }
			if (ui.iv.all) return;
			const q = r.asks[Math.min(ui.iv.idx, r.asks.length - 1)];
			if (q.options[n - 1]) act({ dataset: { act: "choose", id: q.id, arg: q.options[n - 1].k } }, e);
		}
		return;
	}
	if (e.key === "ArrowLeft" || e.key === "ArrowRight") { switchVariant(e.key === "ArrowLeft" ? -1 : 1); e.preventDefault(); return; }
	if (e.key === "ArrowDown" || e.key === "ArrowUp") {
		const rs = rows(); if (!rs.length) return;
		const k = hlKey(); const cur = ui.kbd && ui.hl[k] != null ? ui.hl[k] : -1;
		ui.hl[k] = Math.max(0, Math.min(rs.length - 1, cur + (e.key === "ArrowDown" ? 1 : cur < 0 ? 0 : -1)));
		ui.kbd = true; paintHl();
		const r = rows()[ui.hl[k]]; if (r) { r.scrollIntoView({ block: "nearest", inline: "nearest" }); if (r.dataset.node && ui.variant === "A") trace(r.dataset.node); if (r.dataset.chip && ui.variant === "C") traceC(r.dataset.node); if (r.dataset.node && ui.variant === "D") traceD(r.dataset.node); }
		e.preventDefault(); return;
	}
	if (e.key === "Enter" && ui.kbd && (document.activeElement === document.body || !document.activeElement || document.activeElement.hasAttribute("data-row"))) {
		const r = rows()[ui.hl[hlKey()]]; if (r) { act(r, e); e.preventDefault(); } return;
	}
});

window.addEventListener("hashchange", onHash);
if (!location.hash) history.replaceState(null, "", location.pathname + location.search + "#/map");
if (ui.mission === "big") state = bigInitial();
ui.route = parse(location.hash); ui.stack = [location.hash];
render();
