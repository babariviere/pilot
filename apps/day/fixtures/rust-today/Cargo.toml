[package]
name = "pilot-day-rust"
description = "Optional fixture: the mock Pilot Day Today screen written in Rust only, matched to the TSX app for the stack comparison."
version = "0.1.0"
edition = "2024"
publish = false

# Separate from the Pilot desktop workspace and from the TSX app's crate:
# this fixture never links the shipping app, its daemon client or its storage.
[workspace]

[lib]
path = "src/lib.rs"

[dependencies]
# The TSX app's read model, rules and mock coordinator (apps/day/native), used as plain Rust.
pilot-day-native = { path = "../../native" }
# Unmodified upstream v0.4.0 from crates.io, the same release as the TSX app.
nsh-core = "=0.4.0"
nsh-base = "=0.4.0"

[dev-dependencies]
nsh-engine = { version = "=0.4.0", default-features = false }
nsh-testing = { version = "=0.4.0", default-features = false }
