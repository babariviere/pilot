[package]
name = "pilot-day-native"
description = "Pilot Day read models, v1 daemon contract projection and intents exported to the TSX Today screen."
version = "0.1.0"
edition = "2024"
publish = false

# Separate from the Pilot desktop workspace: Day never links the
# shipping app. Its renderer-independent updater and credential reader are shared.
[workspace]

[lib]
path = "src/lib.rs"

[[bin]]
name = "pilot-desktop"
path = "src/main.rs"
required-features = ["macos-host"]

[[test]]
name = "application_owner"
path = "tests/application_owner.rs"
harness = false
required-features = ["macos-host"]

[features]
# Gates the Day-owned executable and native embedding. The platform crate is a
# plain (macOS-only) dependency: the NSH CLI resolves every nsh crate's
# source from Cargo's resolve, which leaves an inactive optional one out.
macos-host = []

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "=0.3.1"
pilot-desktop-updater = { path = "../../desktop/updater", features = ["native-macos"] }
nsh-platform-macos = { git = "https://github.com/longbridge/nsh", rev = "e626a8dd8f8d8b277b9507cfd5ac74d0e67020f3" }

[target.'cfg(target_os = "linux")'.dependencies]
pilot-desktop-updater = { path = "../../desktop/updater", features = ["native-linux"] }

[dependencies]
nsh-engine = { git = "https://github.com/longbridge/nsh", rev = "e626a8dd8f8d8b277b9507cfd5ac74d0e67020f3" }
# Unmodified upstream v0.4.0, pinned to its peeled release commit.
nsh-core = { git = "https://github.com/longbridge/nsh", rev = "e626a8dd8f8d8b277b9507cfd5ac74d0e67020f3" }
nsh-base = { git = "https://github.com/longbridge/nsh", rev = "e626a8dd8f8d8b277b9507cfd5ac74d0e67020f3" }
# The daemon's v1 Day contracts, read in Rust only. Same versions NSH locks.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "=0.13.5", default-features = false }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", features = ["sink"] }
async-channel = "2"
libc = "0.2"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"

[dev-dependencies]
nsh-core = { git = "https://github.com/longbridge/nsh", rev = "e626a8dd8f8d8b277b9507cfd5ac74d0e67020f3", features = ["declarations"] }
nsh-testing = { git = "https://github.com/longbridge/nsh", rev = "e626a8dd8f8d8b277b9507cfd5ac74d0e67020f3", features = ["bundle"] }
