[package]
name = "pilot-desktop"
version = "0.1.0"
edition = "2024"
publish = false

[features]
native-probes = ["gpui-kit/test-support"]

[workspace]
members = ["visual-worker"]
default-members = ["."]

[patch.crates-io]
gpui-base = { path = ".patched/gpui-base-0.8.0" }
gpui-component = { path = ".patched/gpui-component-0.8.0" }

[dependencies]
gpui-kit = "=0.8.0"
async-channel = "=2.5.0"
futures-util = "=0.3.34"
serde_json = "=1.0.154"
serde = { version = "=1.0.229", features = ["derive", "rc"] }
sha2 = "=0.10.9"
uuid = { version = "=1.28.0", features = ["v4"] }
unicode-normalization = "=0.1.25"
libc = "=0.2.191"
reqwest = { version = "=0.12.28", default-features = false }
tokio = { version = "=1.54.0", features = ["rt", "net", "sync", "time", "macros", "io-util", "process"] }
tokio-tungstenite = { version = "=0.28.0", default-features = false, features = ["handshake"] }

[dev-dependencies]
gpui-kit = { version = "=0.8.0", features = ["test-support"] }
image = { version = "=0.25.10", default-features = false, features = ["png"] }

[profile.dev]
debug = 0

[profile.test]
debug = 0

[[test]]
name = "rendering"
harness = false

[[test]]
name = "capture"
harness = false
test = false

[[test]]
name = "chrome"
harness = false

