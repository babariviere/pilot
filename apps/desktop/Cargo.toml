[package]
name = "pilot-desktop"
version = "0.1.0"
edition = "2024"
publish = false

[[test]]
name = "workspace_changes"
harness = false
required-features = ["native-probes"]

[features]
native-probes = ["gpui-kit/test-support", "pilot-desktop-updater/fixture"]

[[test]]
name = "shortcuts"
harness = false
required-features = ["native-probes"]

[[test]]
name = "native_glass"
harness = false
test = false
required-features = ["native-probes"]

[[test]]
name = "native_menus"
harness = false
required-features = ["native-probes"]

[[test]]
name = "dogfooding_diagnostics"
harness = false
required-features = ["native-probes"]

