name = "artifact_scroll_native"
required-features = ["native-probes"]

[[example]]
name = "image_scroll_native"
required-features = ["native-probes"]

[[example]]
name = "sidebar_scroll_native"
required-features = ["native-probes"]

[[example]]
name = "sidebar_scroll_visible"
required-features = ["native-probes"]

[[test]]
name = "path_completion"
harness = false
required-features = ["native-probes"]

[[test]]
name = "session_file_view"
harness = false
required-features = ["native-probes"]

[[test]]
name = "fonts"
harness = false
test = false
required-features = ["native-probes"]

[[test]]
name = "chat_actions"
path = "tests/chat_actions.rs"
harness = false
required-features = ["native-probes"]

[[test]]
name = "chat_rename"
path = "tests/chat_rename.rs"
harness = false
required-features = ["native-probes"]

[[test]]
name = "project_settings"
path = "tests/project_settings.rs"
harness = false
required-features = ["native-probes"]

[workspace]
members = ["visual-worker"]
exclude = ["updater"]
default-members = ["."]

[[test]]
name = "mission_activity"
harness = false
test = false
required-features = ["native-probes"]

[[test]]
name = "provider_usage"
path = "tests/provider_usage.rs"
harness = false
required-features = ["native-probes"]

[[test]]
name = "usage_overview"
path = "tests/usage_overview.rs"
harness = false
required-features = ["native-probes"]

[patch.crates-io]
gpui-pre = { path = ".patched/gpui-pre-0.3.10" }
gpui-pre-macos = { path = ".patched/gpui-pre-macos-0.3.10" }
gpui-pre-linux = { path = ".patched/gpui-pre-linux-0.3.10" }
gpui-base = { path = ".patched/gpui-base-0.8.1" }
gpui-component = { path = ".patched/gpui-component-0.8.1" }

[[test]]
name = "native_review"
path = "tests/native_review.rs"
harness = false
required-features = ["native-probes"]

[dependencies]
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["registry", "std"] }
gpui-kit = "=0.8.1"
lyon_tessellation = "=1.0.23"
async-channel = "=2.5.0"
futures-util = "=0.3.34"
# Preserve exact persisted reply/order stamps across restarts.
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
serde = { version = "=1.0.229", features = ["derive", "rc"] }
sha2 = "=0.11.1"
uuid = { version = "=1.29.0", features = ["v4"] }
unicode-normalization = "=0.1.26"
unicode-segmentation = "=1.13.3"
libc = "=0.2.191"
base64 = "=0.23.1"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "tiff"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["query"] }
tokio = { version = "=1.54.1", features = ["rt", "net", "sync", "time", "macros", "io-util", "process"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }

[build-dependencies]
sha2 = "=0.11.1"

[dev-dependencies]
gpui-kit = { version = "=0.8.1", features = ["test-support"] }

[target.'cfg(target_os = "linux")'.dependencies]
pilot-desktop-updater = { path = "updater", features = ["native-linux"] }

[target.'cfg(target_os = "macos")'.dependencies]
pilot-desktop-updater = { path = "updater", features = ["native-macos"] }
raw-window-handle = "=0.6.2"

[profile.dev]
debug = 0

[profile.test]
debug = 0

