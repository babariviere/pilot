# cargo-nextest runs every test in its own process, so tests that touch process-wide
# state (environment, current directory, globals) stay isolated while running in parallel.
# Only standard libtest harnesses use nextest. The harness = false native probes keep `cargo test`.

[profile.default]
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci]
fail-fast = false
failure-output = "immediate-final"
