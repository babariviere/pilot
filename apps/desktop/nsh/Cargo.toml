[package]
name = "pilot-nsh"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
pilot-desktop = { path = "..", features = ["nsh-adapter"] }
nsh-core = { git = "https://github.com/longbridge/nsh", rev = "7571948ee4ad05fbc0b08d774e6afc63e039773d", features = ["svg"] }
nsh-base = { git = "https://github.com/longbridge/nsh", rev = "7571948ee4ad05fbc0b08d774e6afc63e039773d", default-features = false, features = ["highlight"] }
nsh-engine = { git = "https://github.com/longbridge/nsh", rev = "7571948ee4ad05fbc0b08d774e6afc63e039773d", default-features = false }
futures-util = "=0.3.34"
async-channel = "=2.5.0"
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["rt", "net", "sync", "time", "macros", "io-util"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }

[features]
native-probes = ["pilot-desktop/native-probes"]

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { git = "https://github.com/longbridge/nsh", rev = "7571948ee4ad05fbc0b08d774e6afc63e039773d", default-features = false, features = ["highlight"] }
dispatch2 = "0.3.1"

[dev-dependencies]
nsh-testing = { git = "https://github.com/longbridge/nsh", rev = "7571948ee4ad05fbc0b08d774e6afc63e039773d", default-features = false }
