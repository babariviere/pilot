[package]
name = "pilot-desktop-updater"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

# Deliberately independent until the desktop owner registers the path dependency.
[workspace]

[features]
default = []
native = []
native-macos = ["native"]
native-linux = ["native"]
fixture = []

[dependencies]
base64 = "=0.22.1"
libc = "=0.2.191"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
ring = "=0.17.14"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
url = "=2.5.8"
zip = { version = "=9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[[bin]]
name = "pilot-desktop-update-helper"
path = "src/bin/update-helper.rs"
required-features = ["native"]


[[example]]
name = "lifecycle-fixture"
path = "examples/lifecycle-fixture.rs"
required-features = ["native"]


[profile.dev]
debug = 0

[profile.test]
debug = 0
