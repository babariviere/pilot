[package]
name = "pilot-desktop-updater"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

# Deliberately independent until the desktop owner registers the path dependency.
[workspace]

[features]
default = []
native = []
native-macos = ["native"]
native-linux = ["native"]
fixture = []
# Numeric phase durations only, for isolated lifecycle qualification builds.
lifecycle-timings = []

[dependencies]
base64 = "=0.23.1"
libc = "=0.2.191"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "rustls"] }
ring = "=0.17.14"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "=0.8.5"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
url = "=2.5.8"
zip = { version = "=9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[[bin]]
name = "pilot-desktop-update-helper"
path = "src/bin/update-helper.rs"
required-features = ["native"]


[[example]]
name = "lifecycle-fixture"
path = "examples/lifecycle-fixture.rs"
required-features = ["native"]


[profile.dev]
debug = 0

[profile.test]
debug = 0
