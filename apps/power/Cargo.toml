[package]
name = "pilot-power"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[[bin]]
name = "PilotPower"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
core-foundation = "0.10"
dispatch2 = "0.3"
signal-hook = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
futures-util = "0.3"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "net"] }
zbus = { version = "5.19", default-features = false, features = ["tokio", "p2p"] }

[dev-dependencies]
futures-util = "0.3"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "net", "test-util"] }
zbus = { version = "5.19", default-features = false, features = ["tokio", "p2p"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
