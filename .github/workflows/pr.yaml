name: PR

on:
  pull_request:
    # Release Please PRs change only these files. GitHub holds runs from its bot-created PRs for manual
    # approval, and the release commit adds nothing to test, so those PRs start no run at all.
    # A PR that changes nothing else is tested by main.yaml after merging.
    paths-ignore:
      - CHANGELOG.md
      - .release-please-manifest.json
      - package.json

permissions:
  contents: read

# A newer push to the same PR cancels its previous run.
concurrency:
  group: pilot-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/tests.yaml

  # Ephemeral hosted runner, read-only token, no secrets or shared build cache.
  # Fork code never enters the native lane; portable tests still cover forks.
  day-qualification:
    if: github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository && github.event.repository.fork == false
    uses: ./.github/workflows/day-qualification.yml
    with:
      # Test the immutable merge commit, never the PR head or a mutable branch.
      ref: ${{ github.sha }}

  # Builds and validates the Linux production package, without signing or publishing it.
  linux-package:
    uses: ./.github/workflows/linux-package.yml
    with:
      ref: ${{ github.sha }}
