name: Renovate configuration

on:
  pull_request:
    paths:
      - renovate.json
      - .github/workflows/renovate-config.yml
      - scripts/renovate-contract.mjs
      - scripts/renovate.test.ts
      - '**/Cargo.toml'
      - '**/Cargo.lock'
  push:
    branches: [main]
    paths:
      - renovate.json
      - .github/workflows/renovate-config.yml
      - scripts/renovate-contract.mjs
      - scripts/renovate.test.ts
      - '**/Cargo.toml'
      - '**/Cargo.lock'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate Renovate configuration
        run: >-
          docker run --rm --network=none
          --volume "$PWD:/repo:ro" --workdir /repo
          --entrypoint renovate-config-validator
          ghcr.io/renovatebot/renovate:44.158.1 --strict --no-global renovate.json
      - name: Verify native npm and Cargo extraction policies
        run: >-
          docker run --rm --network=none
          --volume "$PWD:/repo:ro" --workdir /repo
          --entrypoint node
          ghcr.io/renovatebot/renovate:44.158.1 /repo/scripts/renovate-contract.mjs
