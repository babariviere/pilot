name: Linux production package

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Verify packaging contracts
        run: |
          for script in scripts/linux/*.sh; do bash -n "$script"; done
          node --test scripts/linux/*.test.mjs
          python3 -B -m unittest discover -s scripts/linux -p 'test_*.py'
      - name: Build private Node and production native dependencies in a bounded ABI toolchain
        # A build toolchain, not a destination distro. Every ELF's actual required symbols are audited.
        run: |
          commit="$(git rev-parse HEAD)"
          mkdir -p "$RUNNER_TEMP/linux-package"
          docker run --rm -v "$PWD:/source:ro" -v "$RUNNER_TEMP/linux-package:/output" \
            -e PILOT_RELEASE_COMMIT="$commit" \
            quay.io/pypa/manylinux_2_28_x86_64@sha256:4131ddd7acb9c6c966af02fe7e71edc51e078c2d41f475966697676430bfa2ae \
            bash /source/scripts/linux/bundle-runtime.sh /output
      - name: Validate relocated production package on host libraries and real SSH user-service lifecycle
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y openssh-server dbus-user-session
          bash scripts/linux/verify-service.sh "$RUNNER_TEMP/linux-package/Pilot-linux-x64.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-production-runtime
          path: ${{ runner.temp }}/linux-package/*
          if-no-files-found: error
