name: Linux production package

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      artifact-name:
        type: string
        default: linux-production-runtime

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Verify packaging contracts
        run: |
          for script in scripts/linux/*.sh; do bash -n "$script"; done
          node --test scripts/linux/*.test.mjs
          python3 -B -m unittest discover -s scripts/linux -p 'test_*.py'
          # Release source contracts also run on PRs, without signing credentials.
          python3 -B -m unittest discover -s apps/desktop/scripts -p 'test_gui_release.py'
          python3 -B -m unittest discover -s apps/desktop/scripts -p 'test_bundle_runtime.py'
          python3 -B -m unittest discover -s apps/macos/scripts/tests -p 'test_release_metadata.py'
          node --test apps/desktop/scripts/gui-release-manifest.test.mjs
      - name: Build private Node and production native dependencies in a bounded ABI toolchain
        # A build toolchain, not a destination distro. Every ELF's actual required symbols are audited.
        run: |
          commit="$(git rev-parse HEAD)"
          mkdir -p "$RUNNER_TEMP/linux-package"
          docker run --rm -v "$PWD:/source:ro" -v "$RUNNER_TEMP/linux-package:/output" \
            -e PILOT_RELEASE_COMMIT="$commit" \
            quay.io/pypa/manylinux_2_28_x86_64@sha256:4131ddd7acb9c6c966af02fe7e71edc51e078c2d41f475966697676430bfa2ae \
            bash /source/scripts/linux/bundle-runtime.sh /output
      - name: Validate relocated production package on host libraries
        run: |
          mkdir -p "$RUNNER_TEMP/linux-relocated"
          tar -xzf "$RUNNER_TEMP/linux-package/Pilot-linux-x64.tar.gz" -C "$RUNNER_TEMP/linux-relocated"
          root="$RUNNER_TEMP/linux-relocated/runtime"
          test -x "$root/node/bin/node"
          test -f "$root/check-runtime.mjs"
          "$root/node/bin/node" "$root/check-runtime.mjs"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ runner.temp }}/linux-package/*
          if-no-files-found: error
          overwrite: true
          compression-level: 0
