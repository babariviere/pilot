name: Tests

# Shared by pr.yaml and main.yaml. Results are informational: releases never wait for them.
on:
  workflow_call:
    inputs:
      desktop-release-build:
        description: Build unsigned macOS Rust release executables (no publishing)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  # macos-15 is the standard arm64 runner, not macos-15-intel / macos-15-large.
  # Its default Xcode 16.4 is too old for our Swift 6.2 package manifest.
  DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
  NODE_VERSION: 24.21.0
  # Shared workspace integration tests require jj 0.46+.
  JJ_VERSION: 0.46.0
  JJ_SHA256: 43daa37ce0f9716cdf6fb65a29cbcae74a3160aef048cf3cb3d166d41cb4ab58

jobs:
  # Portable tests use Linux so they do not compete for macOS runner capacity.
  node:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      JJ_SHA256: fce0271158e665ceb82dc66c5eb95b1728649094e9133074f3b5baece345fc08
      # The Linux runner has 4 cores and runs nothing else. The default of 2 suits shared machines.
      PILOT_TEST_CONCURRENCY: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install native addon build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3 make g++
      - name: Install Jujutsu
        run: |
          install_dir="$RUNNER_TEMP/jj"
          archive="$RUNNER_TEMP/jj.tar.gz"
          mkdir -p "$install_dir"
          curl --fail --location --retry 3 --output "$archive" "https://github.com/jj-vcs/jj/releases/download/v$JJ_VERSION/jj-v$JJ_VERSION-x86_64-unknown-linux-musl.tar.gz"
          echo "$JJ_SHA256  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$install_dir"
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/jj" --version
      - name: Verify toolchain and architecture
        run: |
          test "$(uname -m)" = x86_64
          node --version
          jj --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # --timings lists the slowest test files, which decide how long this job takes.
      - run: pnpm test -- --lane=portable --timings

  # Existing native Node/packaging + Swift lane. Rust runs independently below.
  # PRs smoke-test the Swift test build; only release.yaml builds the optimized Swift app.
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      # The scripts default to 2 jobs for agents sharing a machine. CI owns the whole runner.
      PILOT_SWIFT_JOBS: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # A PR checks out its merge commit. Its first parent is the base, so that diff is the PR's change.
          fetch-depth: 2
      - name: Check whether the Mac app changed
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Main pushes always verify the app. PRs skip Swift when nothing it reads changed.
          swift=true
          if [ "$EVENT_NAME" = pull_request ] && files="$(git diff --name-only HEAD^1 HEAD)"; then
            if ! printf '%s\n' "$files" | grep -Eq '^(apps/macos/|packages/artifacts/src/visual/runtime\.js$|packages/protocol/fixtures/visual/|scripts/verification-slot\.py$|\.github/workflows/(pr|tests)\.yaml$|package\.json$)'; then
              swift=false
            fi
          fi
          echo "Swift checks: $swift"
          echo "swift=$swift" >> "$GITHUB_OUTPUT"
      # Installs the pnpm version pinned by package.json's packageManager field.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install Jujutsu
        run: |
          install_dir="$RUNNER_TEMP/jj"
          archive="$RUNNER_TEMP/jj.tar.gz"
          mkdir -p "$install_dir"
          curl --fail --location --retry 3 --output "$archive" "https://github.com/jj-vcs/jj/releases/download/v$JJ_VERSION/jj-v$JJ_VERSION-aarch64-apple-darwin.tar.gz"
          echo "$JJ_SHA256  $archive" | shasum -a 256 --check
          tar -xzf "$archive" -C "$install_dir"
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/jj" --version
      - name: Verify toolchain and architecture
        run: |
          test "$(uname -m)" = arm64
          node --version
          jj --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm test -- --lane=macos
      - name: SwiftLint
        if: ${{ !cancelled() }}
        run: apps/macos/scripts/lint.sh
      - name: Packaging and release metadata tests
        run: |
          for script in apps/macos/scripts/*.sh; do bash -n "$script"; done
          python3 -B -m unittest discover -s apps/macos/scripts/tests -p 'test_*.py'
          node --test apps/macos/scripts/tests/*.test.mjs
      - name: Verify packaged dependency updates
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/')
        run: |
          set -euo pipefail
          stage="$(mktemp -d "$RUNNER_TEMP/renovate-runtime.XXXXXX")"
          trap 'rm -rf "$stage"' EXIT
          apps/macos/scripts/bundle-runtime.sh "$stage/runtime"
          ditto -c -k --keepParent "$stage/runtime" "$stage/runtime.zip"
          mkdir "$stage/relocated"
          ditto -x -k "$stage/runtime.zip" "$stage/relocated"
          apps/macos/scripts/check-runtime.sh "$stage/relocated/runtime"
      # Swift steps still run after a Node failure, so one run reports both.
      - name: Verify Swift toolchain
        id: swift-toolchain
        if: ${{ !cancelled() && steps.changes.outputs.swift == 'true' }}
        env:
          # Test selection/watchdog edits are not compiler inputs. SwiftPM still tracks source/flag changes.
          BUILD_INPUTS: ${{ hashFiles('apps/macos/Package.resolved', 'apps/macos/Package.swift', 'apps/macos/scripts/swift-env.sh', 'apps/macos/scripts/stable-mtimes.py') }}
        run: |
          swift --version
          identity="$(printf '%s\n' "$(swift --version)" "$(xcrun --show-sdk-version)" | shasum -a 256 | awk '{print $1}')"
          echo "key=$identity" >> "$GITHUB_OUTPUT"
          echo "build=swift-build-v1-$RUNNER_OS-$RUNNER_ARCH-$identity-$BUILD_INPUTS" >> "$GITHUB_OUTPUT"
          echo "compatible=swift-build-v1-$RUNNER_OS-$RUNNER_ARCH-$identity-" >> "$GITHUB_OUTPUT"
      - name: Cache pinned Swift dependencies
        if: ${{ !cancelled() && steps.swift-toolchain.outcome == 'success' }}
        uses: actions/cache@v4
        with:
          # Only dependency downloads and patched vendor sources, never build products or signing data.
          path: |
            ~/Library/Caches/org.swift.swiftpm/repositories
            ~/Library/Caches/org.swift.swiftpm/artifacts
            apps/macos/Vendor/libghostty-spm
            apps/macos/Vendor/MermaidKit
            apps/macos/Vendor/QuickJSNG
          key: swift-deps-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift-toolchain.outputs.key }}-${{ hashFiles('apps/macos/Package.resolved', 'apps/macos/Package.swift', 'apps/macos/scripts/vendor-ghostty.sh', 'apps/macos/scripts/patch-ghostty-resources.py', 'apps/macos/scripts/patch-ghostty-layout.py', 'apps/macos/scripts/vendor-mermaidkit.sh', 'apps/macos/scripts/vendor-quickjs.sh', 'apps/macos/scripts/patches/**') }}
      # PRs start from main's newest debug build and recompile only inputs whose contents changed. Main always
      # builds from scratch, and releases never use cached build products.
      - name: Restore the Swift test build
        id: swift-build-cache
        if: ${{ !cancelled() && steps.swift-toolchain.outcome == 'success' && github.event_name == 'pull_request' }}
        uses: actions/cache/restore@v4
        with:
          path: apps/macos/.build
          key: ${{ steps.swift-toolchain.outputs.build }}-${{ github.sha }}
          # A changed manifest/cache key may still reuse compatible objects. SwiftPM replans and
          # rebuilds changed inputs; main's uncached build remains the independent correctness check.
          restore-keys: |
            ${{ steps.swift-toolchain.outputs.build }}-
            ${{ steps.swift-toolchain.outputs.compatible }}
      - name: Give Swift inputs content-derived timestamps
        if: ${{ !cancelled() && steps.swift-toolchain.outcome == 'success' }}
        run: |
          apps/macos/scripts/vendor-ghostty.sh
          apps/macos/scripts/vendor-mermaidkit.sh
          apps/macos/scripts/vendor-quickjs.sh
          python3 apps/macos/scripts/stable-mtimes.py apps/macos
      - name: Swift tests
        id: swift-test
        if: ${{ !cancelled() && steps.swift-toolchain.outcome == 'success' }}
        # Each invocation separately bounds compilation (10 min) and each test runner (3 min),
        # sampling hung native runners before cleanup. Keep an outer bound for the whole chain.
        timeout-minutes: 20
        run: apps/macos/scripts/test.sh
      - name: Upload stalled Swift runner samples
        if: ${{ always() && steps.swift-test.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: swift-test-stalls
          path: ${{ runner.temp }}/swift-test-stalls/*.sample.txt
          if-no-files-found: ignore
          retention-days: 3
      # A crashed test runner prints only its signal. Show the crashed thread from the system crash report.
      - name: Show Swift test crash reports
        if: ${{ failure() && steps.swift-test.outcome == 'failure' }}
        timeout-minutes: 2
        run: |
          python3 - <<'PY'
          import glob, json, os, time
          dirs = [os.path.expanduser("~/Library/Logs/DiagnosticReports"), "/Library/Logs/DiagnosticReports"]
          since = time.time() - 45 * 60
          def recent():
              found = [p for d in dirs for p in glob.glob(d + "/*.ips") if os.path.getmtime(p) > since]
              return sorted(found, key=os.path.getmtime)
          for _ in range(20):  # ReportCrash writes shortly after the process dies.
              if recent():
                  break
              time.sleep(1)
          reports = recent()
          if not reports:
              print("No crash reports from this job.")
          for path in reports[-3:]:
              print("==", os.path.basename(path))
              try:
                  with open(path) as f:
                      f.readline()
                      body = json.loads(f.read())
              except (OSError, ValueError) as error:
                  print("  unreadable:", error)
                  continue
              print("  exception:", json.dumps(body.get("exception")), json.dumps(body.get("asi", {}))[:2000])
              images = body.get("usedImages", [])
              for thread in body.get("threads", []):
                  if not thread.get("triggered"):
                      continue
                  print("  crashed thread:", thread.get("queue") or thread.get("name") or "")
                  for frame in thread.get("frames", [])[:80]:
                      index = frame.get("imageIndex", -1)
                      image = images[index].get("name", "?") if 0 <= index < len(images) else "?"
                      symbol = frame.get("symbol") or hex(frame.get("imageOffset", 0))
                      print(f"    {image} {symbol}+{frame.get('symbolLocation', 0)}")
          PY
      # Only main saves (each build is ~430 MB against the repo's 10 GB cache limit), also after failing
      # tests: the build itself stays valid for the next incremental build.
      - name: Save the Swift test build
        if: ${{ !cancelled() && steps.swift-test.outcome != 'skipped' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v4
        with:
          path: apps/macos/.build
          key: ${{ steps.swift-toolchain.outputs.build }}-${{ github.sha }}
      # PRs package the debug binaries the tests just built and smoke-test the relocated app.
      - name: Bundle the app from the Swift test build
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.swift-test.outcome == 'success' }}
        env:
          CONFIGURATION: debug
          BUNDLE_PREBUILT: '1'
        run: apps/macos/scripts/bundle.sh
      - name: Render delegated task fixtures
        id: pr-fixtures
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.swift-test.outcome == 'success' }}
        run: |
          fixture_home="$(mktemp -d "$RUNNER_TEMP/delegated-home.XXXXXX")"
          HOME="$fixture_home" CFFIXED_USER_HOME="$fixture_home" apps/macos/build/Pilot.app/Contents/MacOS/Pilot --snapshot "$RUNNER_TEMP/delegated-screenshots" --delegated-tasks-only
          HOME="$fixture_home" CFFIXED_USER_HOME="$fixture_home" apps/macos/build/Pilot.app/Contents/MacOS/Pilot --snapshot "$RUNNER_TEMP/delegated-screenshots" --control-sidebar-only
      - name: Upload delegated task screenshots
        if: ${{ !cancelled() && steps.pr-fixtures.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: delegated-task-screenshots
          path: ${{ runner.temp }}/delegated-screenshots/*.png
          if-no-files-found: error

  # Independent Linux Rust test/build sibling: no Node/Swift dependencies.
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Project wrappers pin Rust, CPU=2 and a 4 GiB admission estimate.
      # No user state, shared compiled outputs, signing or production credentials.
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      RUSTFLAGS: -C link-arg=-fuse-ld=lld
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Default PR checkout is the tested merge SHA, NOT the PR head.
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          # tomllib + safe tar extraction in the existing preparation scripts.
          python-version: '3.13'
      - name: Initialize runner-local paths
        run: |
          echo "XDG_CACHE_HOME=$RUNNER_TEMP/desktop-rust-cache" >> "$GITHUB_ENV"
          echo "DESKTOP_CI_OUTPUT=$RUNNER_TEMP/desktop-rust-unsigned" >> "$GITHUB_ENV"
      - name: Check Rust inputs
        id: changes
        run: bash apps/desktop/scripts/ci.sh changed
      - name: Validate Actions schema and expression contexts
        run: python3 apps/desktop/scripts/validate-workflows.py
      - name: Verify workflow and runner contracts (no Cargo)
        run: |
          bash -n apps/desktop/scripts/ci.sh
          python3 -m unittest discover -s apps/desktop/scripts -p 'test_ci.py' -v
          bash apps/desktop/scripts/ci.sh host
      - name: Cache checksummed downloads only
        if: steps.changes.outputs.rust == 'true'
        id: downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/cache
            apps/desktop/.tools/downloads
          # Exact input identity, no fallback/restore prefix; build outputs are cached separately.
          # Cargo.lock and preparation scripts independently verify archives.
          key: desktop-rust-downloads-v1-${{ runner.os }}-${{ runner.arch }}-rust1.98.1-${{ hashFiles('apps/desktop/**', '!apps/desktop/**/__pycache__/**', '!apps/desktop/.tools/**', '!apps/desktop/target/**', '!apps/desktop/.patched/**', '!apps/desktop/evidence/**', 'apps/macos/Sources/PilotVisualEngine/**', 'packages/artifacts/src/visual/**', 'packages/protocol/fixtures/visual/**', '.cargo/**', 'Cargo.*', 'rust-toolchain*', '.github/workflows/tests.yaml', '.github/workflows/pr.yaml', '.github/workflows/main.yaml') }}
      - name: Linux build dependencies (ephemeral runner only)
        if: steps.changes.outputs.rust == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential clang lld pkg-config \
            libfontconfig1-dev libfreetype6-dev libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libxcb1-dev libxcb-xkb-dev libx11-xcb-dev \
            libvulkan-dev libssl-dev libudev-dev libegl1-mesa-dev fonts-dejavu-core \
            sway libgl1-mesa-dri mesa-vulkan-drivers acl
      - name: Bootstrap pinned Rust and helper engine
        if: steps.changes.outputs.rust == 'true'
        timeout-minutes: 10
        run: bash apps/desktop/scripts/ci.sh bootstrap
      # Third-party dependency outputs only (cache-prune drops workspace crates). The key covers
      # every input that can change them; only main saves (10 GB repo cache limit).
      - name: Restore Cargo dependency build cache
        if: steps.changes.outputs.rust == 'true'
        uses: actions/cache/restore@v4
        with:
          path: apps/desktop/target/dev
          key: desktop-rust-target-v1-${{ runner.os }}-${{ runner.arch }}-rust1.98.1-${{ hashFiles('apps/desktop/Cargo.lock', 'apps/desktop/updater/Cargo.lock', 'apps/desktop/rust-toolchain.toml', 'apps/desktop/patches/**', 'apps/desktop/scripts/prepare-patches.py') }}-${{ github.sha }}
          restore-keys: |
            desktop-rust-target-v1-${{ runner.os }}-${{ runner.arch }}-rust1.98.1-${{ hashFiles('apps/desktop/Cargo.lock', 'apps/desktop/updater/Cargo.lock', 'apps/desktop/rust-toolchain.toml', 'apps/desktop/patches/**', 'apps/desktop/scripts/prepare-patches.py') }}-
      - name: Standalone updater portable formatting, strict Clippy and core tests
        if: steps.changes.outputs.rust == 'true'
        timeout-minutes: 10
        run: bash apps/desktop/scripts/ci.sh updater-check
      - name: Linux debug build, formatting, Clippy and portable production tests
        if: steps.changes.outputs.rust == 'true'
        timeout-minutes: 35
        run: env -u DISPLAY -u WAYLAND_DISPLAY bash apps/desktop/scripts/ci.sh check

      - name: Native Linux updater signatures, atomic exchange and process exit
        if: steps.changes.outputs.rust == 'true'
        timeout-minutes: 10
        run: bash apps/desktop/scripts/ci.sh updater-linux-tests

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.rust == 'true'
        with:
          node-version: '24.21.0'
      - name: Owned Linux updater helper install and relaunch fixtures
        if: steps.changes.outputs.rust == 'true'
        timeout-minutes: 10
        run: python3 apps/desktop/scripts/verify_update_lifecycle.py

      - name: Relocated Linux GUI fixture, ELF closure and native Wayland buffer
        if: steps.changes.outputs.rust == 'true'
        timeout-minutes: 2
        run: bash apps/desktop/scripts/ci.sh linux-gui-check
      - name: Prune workspace outputs before saving the dependency cache
        if: ${{ !cancelled() && steps.changes.outputs.rust == 'true' && github.ref == 'refs/heads/main' }}
        run: bash apps/desktop/scripts/ci.sh cache-prune
      - name: Save Cargo dependency build cache
        if: ${{ !cancelled() && steps.changes.outputs.rust == 'true' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v4
        with:
          path: apps/desktop/target/dev
          key: desktop-rust-target-v1-${{ runner.os }}-${{ runner.arch }}-rust1.98.1-${{ hashFiles('apps/desktop/Cargo.lock', 'apps/desktop/updater/Cargo.lock', 'apps/desktop/rust-toolchain.toml', 'apps/desktop/patches/**', 'apps/desktop/scripts/prepare-patches.py') }}-${{ github.sha }}

  # Only macOS helper confinement and native Metal pixels; no portable-suite duplicate.
  rust-macos-native:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Default PR checkout is the tested merge SHA, NOT the PR head.
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          # tomllib + safe tar extraction in the existing preparation scripts.
          python-version: '3.13'
      - name: Initialize runner-local paths
        run: |
          echo "XDG_CACHE_HOME=$RUNNER_TEMP/desktop-rust-cache" >> "$GITHUB_ENV"
          echo "DESKTOP_CI_OUTPUT=$RUNNER_TEMP/desktop-rust-unsigned" >> "$GITHUB_ENV"
      - name: Check Rust inputs
        id: changes
        run: bash apps/desktop/scripts/ci.sh changed
      - name: Cache checksummed downloads only
        if: steps.changes.outputs.rust == 'true'
        id: downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/cache
            apps/desktop/.tools/downloads
          # Exact input identity, no fallback/restore prefix; build outputs are cached separately.
          # Cargo.lock and preparation scripts independently verify archives.
          key: desktop-rust-downloads-v1-${{ runner.os }}-${{ runner.arch }}-rust1.98.1-${{ hashFiles('apps/desktop/**', '!apps/desktop/**/__pycache__/**', '!apps/desktop/.tools/**', '!apps/desktop/target/**', '!apps/desktop/.patched/**', '!apps/desktop/evidence/**', 'apps/macos/Sources/PilotVisualEngine/**', 'packages/artifacts/src/visual/**', 'packages/protocol/fixtures/visual/**', '.cargo/**', 'Cargo.*', 'rust-toolchain*', '.github/workflows/tests.yaml', '.github/workflows/pr.yaml', '.github/workflows/main.yaml') }}
      - name: Bootstrap pinned Rust and helper engine
        if: steps.changes.outputs.rust == 'true'
        timeout-minutes: 10
        run: bash apps/desktop/scripts/ci.sh bootstrap
      # Third-party dependency outputs only (cache-prune drops workspace crates). The key covers
      # every input that can change them; only main saves (10 GB repo cache limit).
      - name: Restore Cargo dependency build cache
        if: steps.changes.outputs.rust == 'true'
        uses: actions/cache/restore@v4
        with:
          path: apps/desktop/target/dev
          key: desktop-rust-target-v1-${{ runner.os }}-${{ runner.arch }}-rust1.98.1-${{ hashFiles('apps/desktop/Cargo.lock', 'apps/desktop/updater/Cargo.lock', 'apps/desktop/rust-toolchain.toml', 'apps/desktop/patches/**', 'apps/desktop/scripts/prepare-patches.py') }}-${{ github.sha }}
          restore-keys: |
            desktop-rust-target-v1-${{ runner.os }}-${{ runner.arch }}-rust1.98.1-${{ hashFiles('apps/desktop/Cargo.lock', 'apps/desktop/updater/Cargo.lock', 'apps/desktop/rust-toolchain.toml', 'apps/desktop/patches/**', 'apps/desktop/scripts/prepare-patches.py') }}-
      - name: Standalone updater macOS Security, ACL, stage, swap and helper tests
        if: steps.changes.outputs.rust == 'true'
        timeout-minutes: 10
        run: bash apps/desktop/scripts/ci.sh updater-mac-tests
      - name: macOS-only helper runtime and confinement tests
        if: steps.changes.outputs.rust == 'true'
        timeout-minutes: 25
        run: bash apps/desktop/scripts/ci.sh mac-tests
      - name: macOS native renderer capability and synthetic probes
        if: steps.changes.outputs.rust == 'true'
        timeout-minutes: 25
        run: bash apps/desktop/scripts/ci.sh native
      - name: Upload native capability result
        if: ${{ !cancelled() && steps.changes.outputs.rust == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-rust-native-status-${{ github.sha }}
          path: apps/desktop/target/ci-native-status.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Prune workspace outputs before saving the dependency cache
        if: ${{ !cancelled() && steps.changes.outputs.rust == 'true' && github.ref == 'refs/heads/main' }}
        run: bash apps/desktop/scripts/ci.sh cache-prune
      - name: Save Cargo dependency build cache
        if: ${{ !cancelled() && steps.changes.outputs.rust == 'true' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v4
        with:
          path: apps/desktop/target/dev
          key: desktop-rust-target-v1-${{ runner.os }}-${{ runner.arch }}-rust1.98.1-${{ hashFiles('apps/desktop/Cargo.lock', 'apps/desktop/updater/Cargo.lock', 'apps/desktop/rust-toolchain.toml', 'apps/desktop/patches/**', 'apps/desktop/scripts/prepare-patches.py') }}-${{ github.sha }}

  # Opt-in reusable seam for later packaging. Normal PR/Main calls leave it OFF.
  # No signing, feeds, release publication or Linux-to-macOS artifact promotion.
  rust-macos-release:
    if: inputs.desktop-release-build
    runs-on: macos-15
    timeout-minutes: 50
    env:
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Default PR checkout is the tested merge SHA, NOT the PR head.
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          # tomllib + safe tar extraction in the existing preparation scripts.
          python-version: '3.13'
      - name: Initialize runner-local paths
        run: |
          echo "XDG_CACHE_HOME=$RUNNER_TEMP/desktop-rust-cache" >> "$GITHUB_ENV"
          echo "DESKTOP_CI_OUTPUT=$RUNNER_TEMP/desktop-rust-unsigned" >> "$GITHUB_ENV"
      - name: Check Rust inputs
        id: changes
        run: bash apps/desktop/scripts/ci.sh changed
      - name: Cache checksummed downloads only
        id: downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/cache
            apps/desktop/.tools/downloads
          # Exact input identity, no fallback/restore prefix or build-output cache.
          # Cargo.lock and preparation scripts independently verify archives.
          key: desktop-rust-downloads-v1-${{ runner.os }}-${{ runner.arch }}-rust1.98.1-${{ hashFiles('apps/desktop/**', '!apps/desktop/**/__pycache__/**', '!apps/desktop/.tools/**', '!apps/desktop/target/**', '!apps/desktop/.patched/**', '!apps/desktop/evidence/**', 'apps/macos/Sources/PilotVisualEngine/**', 'packages/artifacts/src/visual/**', 'packages/protocol/fixtures/visual/**', '.cargo/**', 'Cargo.*', 'rust-toolchain*', '.github/workflows/tests.yaml', '.github/workflows/pr.yaml', '.github/workflows/main.yaml') }}
      - name: Bootstrap pinned Rust and helper engine
        timeout-minutes: 10
        run: bash apps/desktop/scripts/ci.sh bootstrap
      - name: Build locked macOS release app AND visual helper
        timeout-minutes: 35
        run: bash apps/desktop/scripts/ci.sh build
      - name: Stage unsigned macOS binaries and provenance manifest
        run: bash apps/desktop/scripts/ci.sh artifact
      - name: Upload non-release macOS binaries (not an installable update)
