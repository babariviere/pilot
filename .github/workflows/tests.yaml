name: Tests

# Shared by pr.yaml and main.yaml. Results are informational: releases never wait for them.
on:
  workflow_call:

permissions:
  contents: read

env:
  # Pin the native helper/SDK toolchain on standard arm64 macos-15 runners.
  DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
  NODE_VERSION: 24.21.0
  # Shared workspace integration tests require jj 0.46+.
  JJ_VERSION: 0.46.0
  JJ_SHA256: 43daa37ce0f9716cdf6fb65a29cbcae74a3160aef048cf3cb3d166d41cb4ab58

jobs:
  # Always run, including Day-only changes. No native compiler, secrets or release effects.
  day-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Day scripts, immutable inputs and package inventory regressions
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s apps/day/scripts -p 'test_*.py'
          for suite in day_ci_policy day_build_inputs day_artifact_host day_qualification bundle_runtime gui_release; do
            python3 -B -m unittest discover -s apps/desktop/scripts -p "test_$suite.py"
          done
          PYTHONPATH=apps/desktop/scripts python3 -B -m unittest \
            test_ci.CiTests.test_updater_portable_invokes_real_manifest_fmt_strict_clippy_and_nonzero_core_suite \
            test_ci.CiTests.test_linux_updater_native_checks_do_not_use_macos_platform_or_release \
            test_ci.CiTests.test_updater_native_builds_real_helper_and_exact_registered_tests_without_metal \
            test_ci.CiTests.test_updater_missing_registration_zero_counts_and_failed_commands_are_failures \
            test_ci.CiTests.test_missing_local_signed_source_native_test_fails_before_execution \
            test_ci.CiTests.test_missing_temporary_payload_native_tests_fail_before_execution

  # Portable tests use Linux so they do not compete for macOS runner capacity.
  node:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      JJ_SHA256: fce0271158e665ceb82dc66c5eb95b1728649094e9133074f3b5baece345fc08
      # The Linux runner has 4 cores and runs nothing else. The default of 2 suits shared machines.
      PILOT_TEST_CONCURRENCY: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install native addon build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3 make g++
      - name: Install Jujutsu
        run: |
          install_dir="$RUNNER_TEMP/jj"
          archive="$RUNNER_TEMP/jj.tar.gz"
          mkdir -p "$install_dir"
          curl --fail --location --retry 3 --output "$archive" "https://github.com/jj-vcs/jj/releases/download/v$JJ_VERSION/jj-v$JJ_VERSION-x86_64-unknown-linux-musl.tar.gz"
          echo "$JJ_SHA256  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$install_dir"
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/jj" --version
      - name: Verify toolchain and architecture
        run: |
          test "$(uname -m)" = x86_64
          node --version
          jj --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # --timings lists the slowest test files, which decide how long this job takes.
      - run: pnpm test -- --lane=portable --timings

  # Native Node/runtime and packaging contracts, without building the legacy Swift app.
  # Rust and required native helper/security checks run independently below.
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Installs the pnpm version pinned by package.json's packageManager field.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install Jujutsu
        run: |
          install_dir="$RUNNER_TEMP/jj"
          archive="$RUNNER_TEMP/jj.tar.gz"
          mkdir -p "$install_dir"
          curl --fail --location --retry 3 --output "$archive" "https://github.com/jj-vcs/jj/releases/download/v$JJ_VERSION/jj-v$JJ_VERSION-aarch64-apple-darwin.tar.gz"
          echo "$JJ_SHA256  $archive" | shasum -a 256 --check
          tar -xzf "$archive" -C "$install_dir"
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/jj" --version
      - name: Verify toolchain and architecture
        run: |
          test "$(uname -m)" = arm64
          node --version
          jj --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm test -- --lane=macos
      - name: Packaging and release metadata tests
        run: |
          for script in apps/macos/scripts/*.sh; do bash -n "$script"; done
          python3 -B -m unittest discover -s apps/macos/scripts/tests -p 'test_*.py'
          node --test apps/macos/scripts/tests/*.test.mjs
      - name: Verify packaged dependency updates
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/')
        run: |
          set -euo pipefail
          stage="$(mktemp -d "$RUNNER_TEMP/renovate-runtime.XXXXXX")"
          trap 'rm -rf "$stage"' EXIT
          apps/macos/scripts/bundle-runtime.sh "$stage/runtime"
          ditto -c -k --keepParent "$stage/runtime" "$stage/runtime.zip"
          mkdir "$stage/relocated"
          ditto -x -k "$stage/runtime.zip" "$stage/relocated"
          apps/macos/scripts/check-runtime.sh "$stage/relocated/runtime"

  # Shared updater and power helper tests, without the GPUI workspace.
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DESKTOP_CI_SHARED_ONLY: '1'
      RUSTFLAGS: -C link-arg=-fuse-ld=lld
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Validate workflow schema
        run: python3 apps/desktop/scripts/validate-workflows.py
      - name: Install shared helper dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential clang lld pkg-config libssl-dev libudev-dev acl dbus-daemon
      - name: Prepare pinned Rust and nextest
        run: bash apps/desktop/scripts/ci.sh bootstrap
      - name: Test shared updater
        run: |
          bash apps/desktop/scripts/ci.sh updater-check
          bash apps/desktop/scripts/ci.sh updater-linux-tests
          python3 apps/desktop/scripts/verify_update_lifecycle.py
      - name: Test shared power helper
        run: bash apps/desktop/scripts/ci.sh power-check

  rust-macos-native:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DESKTOP_CI_SHARED_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare pinned Rust and nextest
        run: bash apps/desktop/scripts/ci.sh bootstrap
      - name: Test shared macOS updater security and lifecycle
        run: bash apps/desktop/scripts/ci.sh updater-mac-tests
      - name: Test shared power helper
        run: bash apps/desktop/scripts/ci.sh power-check
