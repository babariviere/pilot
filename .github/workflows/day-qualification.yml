name: Day unsigned input qualification

# Main and same-repository PR checks only. Not acceptance or cutover authority.
# No push/tag/dispatch, secrets, signing or shared build cache.
# The uploaded bundle is unsigned CI evidence, not an installable update.
on:
  workflow_call:
    inputs:
      ref:
        description: Full immutable source commit, including its build tools
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: day-native-qualification-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inputs:
    # Reusable workflows keep the CALLER's event_name/ref/sha, not workflow_call.
    if: inputs.ref == github.sha && github.event.repository.fork == false && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository))
    # Standard macos-15 is Apple Silicon, not macos-15-intel. Verify at runtime.
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      RUSTUP_TOOLCHAIN: 1.99.1
      npm_config_manage_package_manager_versions: 'false'
      npm_config_ignore_scripts: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Require an immutable native source
        env:
          SOURCE: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          [[ "$SOURCE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE"
          python3 apps/day/scripts/day_ci_policy.py --source "$SOURCE"
          test "$(uname -m)" = arm64
          test -d "$DEVELOPER_DIR"
          test "$(xcodebuild -version | head -1)" = 'Xcode 26.2'
          test "$(xcrun --sdk macosx --show-sdk-version)" = '26.2'
          xcrun --find clang
          xcrun --find swiftc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/pnpm
      - name: Prepare exact tools and frozen dependencies
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.1 --profile minimal
          echo "RUSTC=$(rustup which --toolchain 1.99.1 rustc)" >> "$GITHUB_ENV"
          stage="$RUNNER_TEMP/nsh-0.6.1"
          mkdir "$stage"
          curl --fail --location --output "$stage/nsh.tar.gz" https://github.com/longbridge/nsh/releases/download/v0.6.1/nsh-macos-arm64.tar.gz
          echo "ee1aed2a4d111fe90e6cceca4b9d5f834c9e11cfda525f8be984261a329c06de  $stage/nsh.tar.gz" | shasum -a 256 --check
          tar -xzf "$stage/nsh.tar.gz" -C "$stage"
          echo "96066fadf2a578216cf5d2692be56b1db1af7523c2ddeab6e1bf951b352b75d5  $stage/nsh/bin/nsh" | shasum -a 256 --check
          test "$("$stage/nsh/bin/nsh" --version)" = 'nsh 0.6.1 (2f51d86)'
          echo "NSH_DAY_CLI=$stage/nsh/bin/nsh" >> "$GITHUB_ENV"
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Day typecheck and focused hidden behavior tests
        run: |
          set -euo pipefail
          apps/day/nsh.sh check
          apps/day/scripts/typecheck.sh
          apps/day/scripts/cargo test --locked --manifest-path apps/day/native/Cargo.toml --features macos-host --lib
          # The real Day bridge and NSH headless root, not native acceptance.
          apps/day/scripts/cargo test --locked --manifest-path apps/day/native/Cargo.toml --features macos-host --test boundary --test connected -- --test-threads=1
          apps/day/scripts/cargo test --locked --manifest-path apps/day/native/Cargo.toml --test feedback_picker --test update -- --test-threads=1
          apps/day/scripts/cargo test --locked --manifest-path apps/day/native/Cargo.toml --test slack_controls -- --test-threads=1
          apps/day/scripts/cargo test --locked --manifest-path apps/day/native/Cargo.toml --test public_bridge inventory_bridge -- --test-threads=1
          # Root preflight/refusal only. No live service, update or native window.
          apps/day/scripts/cargo test --locked --manifest-path apps/day/native/Cargo.toml --features macos-host --test update_host official_root_ -- --test-threads=1
          # Private subprocess probes, not native acceptance or sandbox qualification.
          apps/day/scripts/cargo test --locked --manifest-path apps/day/native/Cargo.toml --test artifact_feasibility -- --test-threads=1
          # Captured runtime and the actual nested native view, attached but never shown.
          apps/day/scripts/cargo test --locked --manifest-path apps/day/native/Cargo.toml --test artifact_runtime
          apps/day/scripts/cargo test --locked --manifest-path apps/day/native/Cargo.toml --features macos-host --test artifact_preview
          node apps/day/scripts/test-artifact-source.mjs
          # NSH accepts one path per invocation. Native and ThreadNative need a visible target.
          for file in App missions/planning/Plan missions/intake/Intake updates/Update feedback/Feedback feedback/FeedbackBridge settings/connections/SlackSettings sessions/Thread sessions/ThreadBridge; do
            apps/day/nsh.sh test "$file.test.tsx"
          done
      - name: Stage source-matched runtime and shared native helpers
        env:
          SOURCE: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          apps/day/scripts/cargo fetch --locked --target aarch64-apple-darwin --manifest-path crates/power/Cargo.toml
          python3 apps/day/scripts/bundle_runtime.py runtime --source "$SOURCE" --output "$RUNNER_TEMP/day-runtime"
          python3 apps/day/scripts/bundle_runtime.py native --gui day --source "$SOURCE" --output "$RUNNER_TEMP/day-helpers"
      - name: Prepare locked offline input dependencies
        run: python3 apps/day/scripts/prepare-day-qualification.py
      - name: Build and qualify source-matched Day inputs
        env:
          SOURCE: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          python3 apps/day/scripts/day_build_inputs.py --source "$SOURCE" --output "$RUNNER_TEMP/day-inputs"
          python3 apps/day/scripts/day_qualification.py --source "$SOURCE" --inputs "$RUNNER_TEMP/day-inputs" --runtime "$RUNNER_TEMP/day-runtime" --native "$RUNNER_TEMP/day-helpers" --output "$RUNNER_TEMP/day-qualification.json"
          mkdir "$RUNNER_TEMP/day-bundle"
          python3 apps/day/scripts/bundle_runtime.py bundle --unsigned-day --source "$SOURCE" --runtime "$RUNNER_TEMP/day-runtime" --executables "$RUNNER_TEMP/day-inputs" --native "$RUNNER_TEMP/day-helpers" --gui-resources "$RUNNER_TEMP/day-inputs/nsh" --output "$RUNNER_TEMP/day-bundle/Pilot.app"
          python3 apps/day/scripts/bundle_runtime.py verify --unsigned-day "$RUNNER_TEMP/day-bundle/Pilot.app"
          ditto -c -k --keepParent "$RUNNER_TEMP/day-bundle/Pilot.app" "$RUNNER_TEMP/Pilot-Day-unsigned.zip"
          echo 'Unsigned Day bundle inventory checked. No signature, launch, release, native acceptance or cutover.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload unsigned Day bundle evidence
        uses: actions/upload-artifact@v4
        with:
          name: pilot-day-unsigned-${{ github.sha }}
          path: ${{ runner.temp }}/Pilot-Day-unsigned.zip
          if-no-files-found: error
          retention-days: 7
