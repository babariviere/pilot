name: Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing draft stable tag to retry (for example v0.2.0). Leave empty to run Release Please.'
        type: string
        required: false

permissions:
  contents: read

# A newer push to the same PR cancels its previous run.
# Other runs get a unique group here. Main pushes are cancelled per job below to protect releases.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pilot-ci-pr-{0}', github.event.pull_request.number) || format('pilot-ci-run-{0}', github.run_id) }}
  cancel-in-progress: true

env:
  # macos-15 is the standard arm64 runner, not macos-15-intel / macos-15-large.
  # Its default Xcode 16.4 is too old for our Swift 6.2 package manifest.
  DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
  NODE_VERSION: 24.21.0
  # Shared workspace integration tests require jj 0.46+.
  JJ_VERSION: 0.46.0
  JJ_SHA256: 43daa37ce0f9716cdf6fb65a29cbcae74a3160aef048cf3cb3d166d41cb4ab58

jobs:
  # Portable tests use Linux so they do not compete for macOS runner capacity.
  # Keep the existing node check name; native coverage and packaging gate releases separately.
  node:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: "pilot-ci-main-node-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore(main): release') && 'main' || github.run_id }}"
      cancel-in-progress: true
    env:
      JJ_SHA256: fce0271158e665ceb82dc66c5eb95b1728649094e9133074f3b5baece345fc08
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install native addon build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3 make g++
      - name: Install Jujutsu
        run: |
          install_dir="$RUNNER_TEMP/jj"
          archive="$RUNNER_TEMP/jj.tar.gz"
          mkdir -p "$install_dir"
          curl --fail --location --retry 3 --output "$archive" "https://github.com/jj-vcs/jj/releases/download/v$JJ_VERSION/jj-v$JJ_VERSION-x86_64-unknown-linux-musl.tar.gz"
          echo "$JJ_SHA256  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$install_dir"
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/jj" --version
      - name: Verify toolchain and architecture
        run: |
          test "$(uname -m)" = x86_64
          node --version
          jj --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test -- --lane=portable

  # OS-sensitive smoke coverage, native Ask artifacts and packaging stay on Darwin.
  node-macos:
    runs-on: macos-15
    timeout-minutes: 15
    # A newer main push cancels this job, which skips the superseded run's release jobs. Release
    # commits, PRs and dispatches get a unique group. Release jobs themselves are never cancelled.
    concurrency:
      group: "pilot-ci-main-node-macos-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore(main): release') && 'main' || github.run_id }}"
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Installs the pnpm version pinned by package.json's packageManager field.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install Jujutsu
        run: |
          install_dir="$RUNNER_TEMP/jj"
          archive="$RUNNER_TEMP/jj.tar.gz"
          mkdir -p "$install_dir"
          curl --fail --location --retry 3 --output "$archive" "https://github.com/jj-vcs/jj/releases/download/v$JJ_VERSION/jj-v$JJ_VERSION-aarch64-apple-darwin.tar.gz"
          echo "$JJ_SHA256  $archive" | shasum -a 256 --check
          tar -xzf "$archive" -C "$install_dir"
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/jj" --version
      - name: Verify toolchain and architecture
        run: |
          test "$(uname -m)" = arm64
          node --version
          jj --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm test -- --lane=macos
      - name: Packaging and release metadata tests
        run: |
          for script in apps/macos/scripts/*.sh; do bash -n "$script"; done
          python3 -B -m unittest discover -s apps/macos/scripts/tests -p 'test_*.py'
          node --test apps/macos/scripts/tests/*.test.mjs
      - name: Verify packaged dependency updates
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/')
        run: |
          set -euo pipefail
          stage="$(mktemp -d "$RUNNER_TEMP/renovate-runtime.XXXXXX")"
          trap 'rm -rf "$stage"' EXIT
          apps/macos/scripts/bundle-runtime.sh "$stage/runtime"
          ditto -c -k --keepParent "$stage/runtime" "$stage/runtime.zip"
          mkdir "$stage/relocated"
          ditto -x -k "$stage/runtime.zip" "$stage/relocated"
          apps/macos/scripts/check-runtime.sh "$stage/relocated/runtime"

  swift-test:
    runs-on: macos-15
    # A normal run takes about 3 minutes. Fail a hung test process quickly instead of after 30.
    timeout-minutes: 12
    # A newer main push cancels this job, which skips the superseded run's release jobs. Release
    # commits, PRs and dispatches get a unique group. Release jobs themselves are never cancelled.
    concurrency:
      group: "pilot-ci-main-swift-test-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore(main): release') && 'main' || github.run_id }}"
      cancel-in-progress: true
    env:
      # The scripts default to 2 jobs for agents sharing a machine. CI owns the whole runner.
      PILOT_SWIFT_JOBS: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify toolchain and architecture
        id: swift-toolchain
        run: |
          test "$(uname -m)" = arm64
          swift --version
          identity="$(printf '%s\n' "$(swift --version)" "$(xcrun --show-sdk-version)" | shasum -a 256 | awk '{print $1}')"
          echo "key=$identity" >> "$GITHUB_OUTPUT"
      - name: Cache pinned Swift dependencies
        uses: actions/cache@v4
        with:
          # Only dependency downloads and patched vendor sources, never build products or signing data.
          path: |
            ~/Library/Caches/org.swift.swiftpm/repositories
            ~/Library/Caches/org.swift.swiftpm/artifacts
            apps/macos/Vendor/libghostty-spm
          key: swift-deps-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift-toolchain.outputs.key }}-${{ hashFiles('apps/macos/Package.resolved', 'apps/macos/Package.swift', 'apps/macos/scripts/vendor-ghostty.sh', 'apps/macos/scripts/patch-ghostty-resources.py') }}
      - run: apps/macos/scripts/test.sh

  app-bundle:
    runs-on: macos-15
    timeout-minutes: 45
    # A newer main push cancels this job, which skips the superseded run's release jobs. Release
    # commits, PRs and dispatches get a unique group. Release jobs themselves are never cancelled.
    concurrency:
      group: "pilot-ci-main-app-bundle-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore(main): release') && 'main' || github.run_id }}"
      cancel-in-progress: true
    env:
      PILOT_SWIFT_JOBS: 3
      # Public configuration only. Private signing keys remain in publishing jobs.
      BUNDLE_RUNTIME: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && github.event.repository.fork == false && '1' || '0' }}
      PILOT_UPDATE_REPOSITORY: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && github.event.repository.fork == false && github.repository || '' }}
      SPARKLE_PUBLIC_KEY: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && github.event.repository.fork == false && vars.SPARKLE_PUBLIC_KEY || '' }}
      LINUX_RUNTIME_PUBLIC_KEY: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && github.event.repository.fork == false && vars.LINUX_RUNTIME_PUBLIC_KEY || '' }}
      # Keep Sparkle builds increasing even after the workflow file was renamed.
      BUNDLE_VERSION_OFFSET: '10000'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # A manual old-draft retry builds the tag once, in this verification job.
          ref: ${{ inputs.release_tag || github.sha }}
      - uses: pnpm/action-setup@v4
        if: env.BUNDLE_RUNTIME == '1' && hashFiles('pnpm-lock.yaml') != ''
      - uses: actions/setup-node@v4
        if: env.BUNDLE_RUNTIME == '1'
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Configure production bundle
        if: env.BUNDLE_RUNTIME == '1'
        run: |
          test -n "$SPARKLE_PUBLIC_KEY" || { echo '::error::Configure SPARKLE_PUBLIC_KEY before building production packages.'; exit 1; }
          test -n "$LINUX_RUNTIME_PUBLIC_KEY" || { echo '::error::Configure LINUX_RUNTIME_PUBLIC_KEY before building production packages.'; exit 1; }
          echo "BUNDLE_VERSION=$((GITHUB_RUN_NUMBER + BUNDLE_VERSION_OFFSET)).$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Verify toolchain and architecture
        id: swift-toolchain
        run: |
          test "$(uname -m)" = arm64
          swift --version
          identity="$(printf '%s\n' "$(swift --version)" "$(xcrun --show-sdk-version)" | shasum -a 256 | awk '{print $1}')"
          echo "key=$identity" >> "$GITHUB_OUTPUT"
      - name: Cache pinned Swift dependencies
        uses: actions/cache@v4
        with:
          # Only dependency downloads and patched vendor sources, never build products or signing data.
          path: |
            ~/Library/Caches/org.swift.swiftpm/repositories
            ~/Library/Caches/org.swift.swiftpm/artifacts
            apps/macos/Vendor/libghostty-spm
          key: swift-deps-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift-toolchain.outputs.key }}-${{ hashFiles('apps/macos/Package.resolved', 'apps/macos/Package.swift', 'apps/macos/scripts/vendor-ghostty.sh', 'apps/macos/scripts/patch-ghostty-resources.py') }}
      - name: Load current release packaging tools
        if: inputs.release_tag != ''
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .pilot-release-tools
          sparse-checkout: apps/macos/scripts
      - name: Apply current packaging policy to tagged application source
        if: inputs.release_tag != ''
        # An older draft must still use ZIP-only publishing and runtime cleanup.
        # Overlay only packaging helpers, keeping the app, dependencies and vendor pins tagged.
        run: |
          cp .pilot-release-tools/apps/macos/scripts/production_artifact.py apps/macos/scripts/production_artifact.py
          cp .pilot-release-tools/apps/macos/scripts/release_metadata.py apps/macos/scripts/release_metadata.py
          cp .pilot-release-tools/apps/macos/scripts/publish-release.sh apps/macos/scripts/publish-release.sh
          # Preserve the executable bit even when retrying a tag with a non-executable helper.
          cp -p .pilot-release-tools/apps/macos/scripts/check-runtime.sh apps/macos/scripts/check-runtime.sh
      # Build, sign and smoke-test the relocated app, not just the Swift executable.
      - run: apps/macos/scripts/bundle.sh
      - name: Archive and verify the production app
        if: env.BUNDLE_RUNTIME == '1'
        run: |
          stage="$RUNNER_TEMP/macos-production"
          mkdir -p "$stage"
          ditto -c -k --sequesterRsrc --keepParent apps/macos/build/Pilot.app "$stage/Pilot-arm64.zip"
          python3 apps/macos/scripts/production_artifact.py create "$stage" "$(git rev-parse HEAD)" "$(node -p 'require("./package.json").version')"
          ditto -x -k "$stage/Pilot-arm64.zip" "$stage/extracted"
          codesign --verify --deep --strict "$stage/extracted/Pilot.app"
          apps/macos/scripts/check-runtime.sh "$stage/extracted/Pilot.app/Contents/Resources/runtime"
      - name: Upload verified production app
        if: env.BUNDLE_RUNTIME == '1'
        uses: actions/upload-artifact@v4
        with:
          name: macos-production-app
          path: |
            ${{ runner.temp }}/macos-production/Pilot-arm64.zip
            ${{ runner.temp }}/macos-production/production-artifact.json
          if-no-files-found: error
          overwrite: true
          compression-level: 0
      - name: Render delegated task fixtures
        # Older tags may predate this snapshot mode; their bundle/runtime checks still run above.
        if: inputs.release_tag == ''
        run: |
          fixture_home="$(mktemp -d "$RUNNER_TEMP/delegated-home.XXXXXX")"
          HOME="$fixture_home" CFFIXED_USER_HOME="$fixture_home" apps/macos/build/Pilot.app/Contents/MacOS/Pilot --snapshot "$RUNNER_TEMP/delegated-screenshots" --delegated-tasks-only
      - name: Upload delegated task screenshots
        if: inputs.release_tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: delegated-task-screenshots
          path: ${{ runner.temp }}/delegated-screenshots/*.png
          if-no-files-found: error

  release-please:
    needs: [node, node-macos, swift-test, app-bundle, linux-production]
    # Never expose write permissions or release credentials to PRs or forks.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && github.event.repository.fork == false && inputs.release_tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pilot-release-please-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Build and validate once per commit, then promote the same bytes after release creation.
  linux-production:
    concurrency:
      group: "pilot-ci-main-linux-production-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore(main): release') && 'main' || github.run_id }}"
      cancel-in-progress: true
    uses: ./.github/workflows/linux-package.yml
    with:
      ref: ${{ inputs.release_tag || github.sha }}

  # Release Please can discover an earlier merged release PR after a newer main run finishes.
  # Rebuild only that exceptional source mismatch; normal releases promote linux-production.
  linux-release-rebuild:
    needs: [node, node-macos, swift-test, app-bundle, linux-production, release-please]
    if: always() && needs.node.result == 'success' && needs.node-macos.result == 'success' && needs.swift-test.result == 'success' && needs.app-bundle.result == 'success' && needs.linux-production.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && github.event.repository.fork == false && ((needs.release-please.result == 'success' && needs.release-please.outputs.release_created == 'true') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')) && inputs.release_tag == '' && needs.release-please.outputs.sha != github.sha
    uses: ./.github/workflows/linux-package.yml
    with:
      ref: ${{ needs.release-please.outputs.sha }}
      artifact-name: linux-release-runtime

  linux-publish:
    needs: [node, node-macos, swift-test, app-bundle, linux-production, release-please, linux-release-rebuild]
    if: always() && needs.node.result == 'success' && needs.node-macos.result == 'success' && needs.swift-test.result == 'success' && needs.app-bundle.result == 'success' && needs.linux-production.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && github.event.repository.fork == false && ((needs.release-please.result == 'success' && needs.release-please.outputs.release_created == 'true') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')) && (needs.linux-release-rebuild.result == 'success' || needs.linux-release-rebuild.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Require Linux runtime signing configuration
        env:
          LINUX_RUNTIME_PRIVATE_KEY: ${{ secrets.LINUX_RUNTIME_PRIVATE_KEY }}
          LINUX_RUNTIME_PUBLIC_KEY: ${{ vars.LINUX_RUNTIME_PUBLIC_KEY }}
        run: |
          if [ -z "$LINUX_RUNTIME_PUBLIC_KEY" ] || [ -z "$LINUX_RUNTIME_PRIVATE_KEY" ]; then
            echo '::error::Configure the LINUX_RUNTIME_PUBLIC_KEY repository variable and LINUX_RUNTIME_PRIVATE_KEY secret (see scripts/linux/README.md) before publishing.'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.linux-release-rebuild.result == 'success' && 'linux-release-runtime' || 'linux-production-runtime' }}
          path: release
      - name: Sign verified manifest and attach to the matching stable draft
        env:
          GH_TOKEN: ${{ github.token }}
          LINUX_RUNTIME_PRIVATE_KEY: ${{ secrets.LINUX_RUNTIME_PRIVATE_KEY }}
          LINUX_RUNTIME_PUBLIC_KEY: ${{ vars.LINUX_RUNTIME_PUBLIC_KEY }}
          RELEASE_TAG: ${{ inputs.release_tag || needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          test "$RELEASE_TAG" = "$(node -p "JSON.parse(require('node:fs').readFileSync('release/runtime-manifest.json')).tag")"
          test "$(git rev-parse HEAD)" = "$(node -p "JSON.parse(require('node:fs').readFileSync('release/runtime-manifest.json')).commit")"
          test "$(git rev-parse HEAD)" = "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)"
          node scripts/linux/release-manifest.mjs sign "$PWD/release"
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease > release-state.json
          node --input-type=module -e 'import fs from "node:fs"; const r=JSON.parse(fs.readFileSync("release-state.json")); if (!r.isDraft || r.isPrerelease) throw Error("Only stable drafts may receive runtime assets")'
          gh release upload "$RELEASE_TAG" release/Pilot-linux-x64.tar.gz release/runtime-manifest.json release/runtime-manifest.json.sig --clobber

  release:
    # Signs and uploads the verified macOS update in parallel with the Linux runtime. The publish job
    # releases the draft once both platforms have uploaded their assets.
    needs: [node, node-macos, swift-test, app-bundle, linux-production, release-please]
    # always() permits an explicit retry when release-please is intentionally skipped.
    if: always() && needs.node.result == 'success' && needs.node-macos.result == 'success' && needs.swift-test.result == 'success' && needs.app-bundle.result == 'success' && needs.linux-production.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && github.event.repository.fork == false && ((needs.release-please.result == 'success' && needs.release-please.outputs.release_created == 'true') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != ''))
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      PILOT_UPDATE_REPOSITORY: ${{ github.repository }}
      SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
      LINUX_RUNTIME_PUBLIC_KEY: ${{ vars.LINUX_RUNTIME_PUBLIC_KEY }}
      RELEASE_TAG: ${{ inputs.release_tag || needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Verify the immutable release commit, not a newer main during a retry.
          ref: ${{ inputs.release_tag || needs.release-please.outputs.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify tagged release source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - "$RELEASE_TAG" <<'PY'
          import json, re, sys
          version = json.load(open('package.json'))['version']
          if not re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', version) or sys.argv[1] != f'v{version}':
              raise SystemExit('Release tag must match the stable package.json version.')
          PY
          test "$(git rev-parse HEAD)" = "$(gh api "repos/$PILOT_UPDATE_REPOSITORY/commits/$RELEASE_TAG" --jq '.sha')"
      # Normally this only promotes the verified ZIP. A source mismatch rebuilds the tag, never main.
      - name: Load current release packaging tools
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .pilot-release-tools
          sparse-checkout: apps/macos/scripts
      - name: Apply current packaging policy to tagged application source
        # An older draft must still use ZIP-only publishing and runtime cleanup.
        # Overlay only packaging helpers, keeping the app, dependencies and vendor pins tagged.
        run: |
          cp .pilot-release-tools/apps/macos/scripts/production_artifact.py apps/macos/scripts/production_artifact.py
          cp .pilot-release-tools/apps/macos/scripts/release_metadata.py apps/macos/scripts/release_metadata.py
          cp .pilot-release-tools/apps/macos/scripts/publish-release.sh apps/macos/scripts/publish-release.sh
          # Preserve the executable bit even when retrying a tag with a non-executable helper.
          cp -p .pilot-release-tools/apps/macos/scripts/check-runtime.sh apps/macos/scripts/check-runtime.sh
      - name: Require update signing configuration
        env:
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          LINUX_RUNTIME_PUBLIC_KEY: ${{ vars.LINUX_RUNTIME_PUBLIC_KEY }}
        run: |
          if [ -z "$SPARKLE_PUBLIC_KEY" ] || [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo '::error::Configure SPARKLE_PUBLIC_KEY repository variable and SPARKLE_PRIVATE_KEY secret with apps/macos/scripts/setup-updates.sh before publishing.'
            exit 1
          fi
          # The app pins this key to authenticate Linux runtimes it installs over SSH.
          if [ -z "$LINUX_RUNTIME_PUBLIC_KEY" ]; then
            echo '::error::Configure the LINUX_RUNTIME_PUBLIC_KEY repository variable (see scripts/linux/README.md) before publishing.'
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: macos-production-app
          path: ${{ runner.temp }}/macos-production
      - name: Check whether the production artifact matches the release source
        id: production-source
        env:
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          stage="$RUNNER_TEMP/macos-production"
          source="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["commit"])' "$stage/production-artifact.json")"
          if [ "$source" != "$(git rev-parse HEAD)" ]; then
            # Never promote another commit's bytes. Rebuild the verified immutable tag below.
            if [ "$source" != "$GITHUB_SHA" ] || [ -n "$REQUESTED_RELEASE_TAG" ]; then
              echo '::error::Production artifact has an unexpected source commit.'
              exit 1
            fi
            echo 'rebuild=true' >> "$GITHUB_OUTPUT"
          else
            python3 apps/macos/scripts/production_artifact.py verify "$stage" "$(git rev-parse HEAD)" "$(node -p 'require("./package.json").version')"
          fi
      - uses: pnpm/action-setup@v4
        if: steps.production-source.outputs.rebuild == 'true' && hashFiles('pnpm-lock.yaml') != ''
      - name: Rebuild only when Release Please selected a different source commit
        if: steps.production-source.outputs.rebuild == 'true'
        env:
          BUNDLE_RUNTIME: '1'
          PILOT_SWIFT_JOBS: 3
          BUNDLE_VERSION_OFFSET: '10000'
        run: |
          export BUNDLE_VERSION="$((GITHUB_RUN_NUMBER + BUNDLE_VERSION_OFFSET)).$GITHUB_RUN_ATTEMPT"
          apps/macos/scripts/bundle.sh
          stage="$RUNNER_TEMP/macos-production"
          rm "$stage/Pilot-arm64.zip" "$stage/production-artifact.json"
          ditto -c -k --sequesterRsrc --keepParent apps/macos/build/Pilot.app "$stage/Pilot-arm64.zip"
          python3 apps/macos/scripts/production_artifact.py create "$stage" "$(git rev-parse HEAD)" "$(node -p 'require("./package.json").version')"
          ditto -x -k "$stage/Pilot-arm64.zip" "$stage/rebuilt"
          codesign --verify --deep --strict "$stage/rebuilt/Pilot.app"
          apps/macos/scripts/check-runtime.sh "$stage/rebuilt/Pilot.app/Contents/Resources/runtime"
      - name: Verify and restore the release ZIP
        run: |
          stage="$RUNNER_TEMP/macos-production"
          python3 apps/macos/scripts/production_artifact.py verify "$stage" "$(git rev-parse HEAD)" "$(node -p 'require("./package.json").version')"
          mkdir -p apps/macos/build
          ditto -x -k "$stage/Pilot-arm64.zip" apps/macos/build
          codesign --verify --deep --strict apps/macos/build/Pilot.app
      - name: Sign and upload the macOS update ZIP and appcast to the stable draft
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: apps/macos/scripts/publish-release.sh apps/macos/build/Pilot.app "$RUNNER_TEMP/macos-production/Pilot-arm64.zip"

  publish:
    needs: [release-please, linux-publish, release]
    if: always() && needs.linux-publish.result == 'success' && needs.release.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Serialize stable publishing. Semantic-version ordering protects latest.
    concurrency:
      group: pilot-macos-release-${{ github.repository }}-stable
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      # Current release tools, as in the release job's packaging overlay. No tagged source is built here.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          sparse-checkout: apps/macos/scripts
      - name: Publish the complete stable draft
        env:
          GH_TOKEN: ${{ github.token }}
          PILOT_UPDATE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || needs.release-please.outputs.tag_name }}
        run: bash apps/macos/scripts/finalize-release.sh
