name: Release

# Main pushes maintain the Release Please PR only. An explicit dispatch can create
# a draft for a merged release PR. Nothing here builds, signs, uploads or publishes.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      create_draft:
        description: 'Create a draft for a merged release PR (no assets or publishing)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release-please:
    # Never expose write permissions to forks.
    if: github.ref == 'refs/heads/main' && github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pilot-release-please-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: ${{ github.event_name != 'workflow_dispatch' || inputs.create_draft != true }}
