name: Desktop Rust

on:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - '!apps/desktop/evidence/**'
      - 'apps/macos/Sources/PilotVisualEngine/**'
      - 'packages/artifacts/src/visual/**'
      - 'packages/protocol/fixtures/visual/**'
      - '.cargo/**'
      - 'Cargo.*'
      - 'rust-toolchain*'
      - '.github/workflows/desktop-rust.yml'
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - '!apps/desktop/evidence/**'
      - 'apps/macos/Sources/PilotVisualEngine/**'
      - 'packages/artifacts/src/visual/**'
      - 'packages/protocol/fixtures/visual/**'
      - '.cargo/**'
      - 'Cargo.*'
      - 'rust-toolchain*'
      - '.github/workflows/desktop-rust.yml'

permissions:
  contents: read

concurrency:
  group: desktop-rust-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      # Project wrappers pin Rust/mbx, CPU=2 and a 4 GiB admission estimate.
      # No user state, shared compiled outputs, signing or production credentials.
      XDG_CACHE_HOME: ${{ runner.temp }}/desktop-rust-cache
      DESKTOP_CI_OUTPUT: ${{ runner.temp }}/desktop-rust-unsigned
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Default PR checkout is the tested merge SHA, NOT the PR head.
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          # tomllib + safe tar extraction in the existing preparation scripts.
          python-version: '3.13'
      - name: Verify workflow and runner contracts (no Cargo)
        run: |
          bash -n apps/desktop/scripts/ci.sh
          python3 -m unittest discover -s apps/desktop/scripts -p 'test_ci.py' -v
          bash apps/desktop/scripts/ci.sh host
      - name: Cache checksummed downloads only
        id: downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/cache
            apps/desktop/.tools/downloads
          # Exact input identity, no fallback/restore prefix or target/mbx cache.
          # Cargo.lock and preparation scripts independently verify archives.
          key: desktop-rust-downloads-v1-${{ runner.os }}-${{ runner.arch }}-rust1.98.1-mbx1.26.0-${{ hashFiles('apps/desktop/**', '!apps/desktop/**/__pycache__/**', '!apps/desktop/evidence/**', 'apps/macos/Sources/PilotVisualEngine/**', 'packages/artifacts/src/visual/**', 'packages/protocol/fixtures/visual/**', '.cargo/**', 'Cargo.*', 'rust-toolchain*', '.github/workflows/desktop-rust.yml') }}
      - name: Bootstrap pinned Rust, mbx and helper engine
        timeout-minutes: 10
        run: bash apps/desktop/scripts/ci.sh bootstrap
      - name: Formatting, strict Clippy, library and helper checks
        timeout-minutes: 35
        run: bash apps/desktop/scripts/ci.sh check
      - name: Build locked release app AND visual helper
        timeout-minutes: 35
        run: bash apps/desktop/scripts/ci.sh build
      - name: Stage unsigned binaries and provenance manifest
        run: bash apps/desktop/scripts/ci.sh artifact
      - name: Upload non-release binaries (not an installable update)
        uses: actions/upload-artifact@v4
        with:
          name: desktop-rust-unsigned-aarch64-apple-darwin-${{ github.sha }}
          path: ${{ env.DESKTOP_CI_OUTPUT }}
          if-no-files-found: error
          retention-days: 7
      - name: Native renderer capability and synthetic probes
        timeout-minutes: 20
        run: bash apps/desktop/scripts/ci.sh native
      - name: Upload native capability result
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-rust-native-status-${{ github.sha }}
          path: apps/desktop/target/ci-native-status.txt
          if-no-files-found: warn
          retention-days: 7
