name: Pilot CI and macOS release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing draft stable tag to retry (for example v0.2.0). Leave empty to run Release Please.'
        type: string
        required: false

permissions:
  contents: read

# A newer push to the same PR cancels its previous run.
# Other runs get a unique group here. Main pushes are cancelled per job below to protect releases.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pilot-ci-pr-{0}', github.event.pull_request.number) || format('pilot-ci-run-{0}', github.run_id) }}
  cancel-in-progress: true

env:
  # macos-15 is the standard arm64 runner, not macos-15-intel / macos-15-large.
  # Its default Xcode 16.4 is too old for our Swift 6.2 package manifest.
  DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
  NODE_VERSION: 24.21.0
  # Shared workspace integration tests require jj 0.46+.
  JJ_VERSION: 0.46.0
  JJ_SHA256: 43daa37ce0f9716cdf6fb65a29cbcae74a3160aef048cf3cb3d166d41cb4ab58

jobs:
  # Portable tests use Linux so they do not compete for macOS runner capacity.
  # Keep the existing node check name; native coverage and packaging gate releases separately.
  node:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: "pilot-ci-main-node-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore(main): release') && 'main' || github.run_id }}"
      cancel-in-progress: true
    env:
      JJ_SHA256: fce0271158e665ceb82dc66c5eb95b1728649094e9133074f3b5baece345fc08
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install native addon build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3 make g++
      - name: Install Jujutsu
        run: |
          install_dir="$RUNNER_TEMP/jj"
          archive="$RUNNER_TEMP/jj.tar.gz"
          mkdir -p "$install_dir"
          curl --fail --location --retry 3 --output "$archive" "https://github.com/jj-vcs/jj/releases/download/v$JJ_VERSION/jj-v$JJ_VERSION-x86_64-unknown-linux-musl.tar.gz"
          echo "$JJ_SHA256  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$install_dir"
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/jj" --version
      - name: Verify toolchain and architecture
        run: |
          test "$(uname -m)" = x86_64
          node --version
          jj --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test -- --lane=portable

  # OS-sensitive smoke coverage, native Ask artifacts and packaging stay on Darwin.
  node-macos:
    runs-on: macos-15
    timeout-minutes: 15
    # A newer main push cancels this job, which skips the superseded run's release jobs. Release
    # commits, PRs and dispatches get a unique group. Release jobs themselves are never cancelled.
    concurrency:
      group: "pilot-ci-main-node-macos-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore(main): release') && 'main' || github.run_id }}"
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Installs the pnpm version pinned by package.json's packageManager field.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install Jujutsu
        run: |
          install_dir="$RUNNER_TEMP/jj"
          archive="$RUNNER_TEMP/jj.tar.gz"
          mkdir -p "$install_dir"
          curl --fail --location --retry 3 --output "$archive" "https://github.com/jj-vcs/jj/releases/download/v$JJ_VERSION/jj-v$JJ_VERSION-aarch64-apple-darwin.tar.gz"
          echo "$JJ_SHA256  $archive" | shasum -a 256 --check
          tar -xzf "$archive" -C "$install_dir"
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/jj" --version
      - name: Verify toolchain and architecture
        run: |
          test "$(uname -m)" = arm64
          node --version
          jj --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm test -- --lane=macos
      - name: Packaging and release metadata tests
        run: |
          for script in apps/macos/scripts/*.sh; do bash -n "$script"; done
          python3 -B -m unittest discover -s apps/macos/scripts/tests -p 'test_*.py'
          node --test apps/macos/scripts/tests/*.test.mjs
      - name: Verify packaged dependency updates
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/')
        run: |
          set -euo pipefail
          stage="$(mktemp -d "$RUNNER_TEMP/renovate-runtime.XXXXXX")"
          trap 'rm -rf "$stage"' EXIT
          apps/macos/scripts/bundle-runtime.sh "$stage/runtime"
          ditto -c -k --keepParent "$stage/runtime" "$stage/runtime.zip"
          mkdir "$stage/relocated"
          ditto -x -k "$stage/runtime.zip" "$stage/relocated"
          apps/macos/scripts/check-runtime.sh "$stage/relocated/runtime"

  swift-test:
    runs-on: macos-15
    # A normal run takes about 3 minutes. Fail a hung test process quickly instead of after 30.
    timeout-minutes: 12
    # A newer main push cancels this job, which skips the superseded run's release jobs. Release
    # commits, PRs and dispatches get a unique group. Release jobs themselves are never cancelled.
    concurrency:
      group: "pilot-ci-main-swift-test-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore(main): release') && 'main' || github.run_id }}"
      cancel-in-progress: true
    env:
      # The scripts default to 2 jobs for agents sharing a machine. CI owns the whole runner.
      PILOT_SWIFT_JOBS: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify toolchain and architecture
        id: swift-toolchain
        run: |
          test "$(uname -m)" = arm64
          swift --version
          identity="$(printf '%s\n' "$(swift --version)" "$(xcrun --show-sdk-version)" | shasum -a 256 | awk '{print $1}')"
          echo "key=$identity" >> "$GITHUB_OUTPUT"
      - name: Cache pinned Swift dependencies
        uses: actions/cache@v4
        with:
          # Only dependency downloads and patched vendor sources, never build products or signing data.
          path: |
            ~/Library/Caches/org.swift.swiftpm/repositories
            ~/Library/Caches/org.swift.swiftpm/artifacts
            apps/macos/Vendor/libghostty-spm
          key: swift-deps-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift-toolchain.outputs.key }}-${{ hashFiles('apps/macos/Package.resolved', 'apps/macos/Package.swift', 'apps/macos/scripts/vendor-ghostty.sh', 'apps/macos/scripts/patch-ghostty-resources.py') }}
      - run: apps/macos/scripts/test.sh

  app-bundle:
    runs-on: macos-15
    timeout-minutes: 15
    # A newer main push cancels this job, which skips the superseded run's release jobs. Release
    # commits, PRs and dispatches get a unique group. Release jobs themselves are never cancelled.
    concurrency:
      group: "pilot-ci-main-app-bundle-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore(main): release') && 'main' || github.run_id }}"
      cancel-in-progress: true
    env:
      PILOT_SWIFT_JOBS: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify toolchain and architecture
        id: swift-toolchain
        run: |
          test "$(uname -m)" = arm64
          swift --version
          identity="$(printf '%s\n' "$(swift --version)" "$(xcrun --show-sdk-version)" | shasum -a 256 | awk '{print $1}')"
          echo "key=$identity" >> "$GITHUB_OUTPUT"
      - name: Cache pinned Swift dependencies
        uses: actions/cache@v4
        with:
          # Only dependency downloads and patched vendor sources, never build products or signing data.
          path: |
            ~/Library/Caches/org.swift.swiftpm/repositories
            ~/Library/Caches/org.swift.swiftpm/artifacts
            apps/macos/Vendor/libghostty-spm
          key: swift-deps-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift-toolchain.outputs.key }}-${{ hashFiles('apps/macos/Package.resolved', 'apps/macos/Package.swift', 'apps/macos/scripts/vendor-ghostty.sh', 'apps/macos/scripts/patch-ghostty-resources.py') }}
      # Build, sign and smoke-test the relocated app, not just the Swift executable.
      - run: apps/macos/scripts/bundle.sh
      - name: Render delegated task fixtures
        run: |
          fixture_home="$(mktemp -d "$RUNNER_TEMP/delegated-home.XXXXXX")"
          HOME="$fixture_home" CFFIXED_USER_HOME="$fixture_home" apps/macos/build/Pilot.app/Contents/MacOS/Pilot --snapshot "$RUNNER_TEMP/delegated-screenshots" --delegated-tasks-only
      - name: Upload delegated task screenshots
        uses: actions/upload-artifact@v4
        with:
          name: delegated-task-screenshots
          path: ${{ runner.temp }}/delegated-screenshots/*.png
          if-no-files-found: error

  release-please:
    needs: [node, node-macos, swift-test, app-bundle]
    # Never expose write permissions or release credentials to PRs or forks.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && github.event.repository.fork == false && inputs.release_tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pilot-release-please-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  linux-release:
    needs: [node, node-macos, swift-test, app-bundle, release-please]
    if: always() && needs.node.result == 'success' && needs.node-macos.result == 'success' && needs.swift-test.result == 'success' && needs.app-bundle.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && github.event.repository.fork == false && ((needs.release-please.result == 'success' && needs.release-please.outputs.release_created == 'true') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != ''))
    uses: ./.github/workflows/linux-package.yml
    with:
      ref: ${{ inputs.release_tag || needs.release-please.outputs.tag_name }}

  linux-publish:
    needs: [linux-release, release-please]
    if: always() && needs.linux-release.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - uses: actions/download-artifact@v4
        with:
          name: linux-production-runtime
          path: release
      - name: Sign verified manifest and attach to the matching stable draft
        env:
          GH_TOKEN: ${{ github.token }}
          LINUX_RUNTIME_PRIVATE_KEY: ${{ secrets.LINUX_RUNTIME_PRIVATE_KEY }}
          LINUX_RUNTIME_PUBLIC_KEY: ${{ vars.LINUX_RUNTIME_PUBLIC_KEY }}
          RELEASE_TAG: ${{ inputs.release_tag || needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          node scripts/linux/release-manifest.mjs sign "$PWD/release"
          test "$RELEASE_TAG" = "$(node -p "JSON.parse(require('node:fs').readFileSync('release/runtime-manifest.json')).tag")"
          test "$(git rev-parse HEAD)" = "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)"
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease > release-state.json
          node --input-type=module -e 'import fs from "node:fs"; const r=JSON.parse(fs.readFileSync("release-state.json")); if (!r.isDraft || r.isPrerelease) throw Error("Only stable drafts may receive runtime assets")'
          gh release upload "$RELEASE_TAG" release/Pilot-linux-x64.tar.gz release/runtime-manifest.json release/runtime-manifest.json.sig --clobber

  release:
    needs: [node, node-macos, swift-test, app-bundle, release-please, linux-publish]
    # always() permits an explicit retry when release-please is intentionally skipped.
    if: always() && needs.node.result == 'success' && needs.node-macos.result == 'success' && needs.swift-test.result == 'success' && needs.app-bundle.result == 'success' && needs.linux-publish.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && github.event.repository.fork == false && ((needs.release-please.result == 'success' && needs.release-please.outputs.release_created == 'true') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != ''))
    runs-on: macos-15
    timeout-minutes: 45
    # Serialize stable publishing. Semantic-version ordering protects latest.
    concurrency:
      group: pilot-macos-release-${{ github.repository }}-stable
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      PILOT_UPDATE_REPOSITORY: ${{ github.repository }}
      BUNDLE_VERSION: ${{ github.run_number }}.${{ github.run_attempt }}
      RELEASE_TAG: ${{ inputs.release_tag || needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Build the immutable release commit, not a newer main during a retry.
          ref: ${{ inputs.release_tag || needs.release-please.outputs.sha || github.sha }}
      # bundle-runtime.sh installs the production runtime with pnpm. Retried drafts from before the
      # pnpm migration have no pnpm pin and still install with npm.
      - uses: pnpm/action-setup@v4
        if: hashFiles('pnpm-lock.yaml') != ''
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify tagged release source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - "$RELEASE_TAG" <<'PY'
          import json, re, sys
          version = json.load(open('package.json'))['version']
          if not re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', version) or sys.argv[1] != f'v{version}':
              raise SystemExit('Release tag must match the stable package.json version.')
          PY
          test "$(git rev-parse HEAD)" = "$(gh api "repos/$PILOT_UPDATE_REPOSITORY/commits/$RELEASE_TAG" --jq '.sha')"
      # Tests are not repeated here. Both Node lanes and Swift verification gate this job, and a draft
      # retry rebuilds a tag whose commit already passed them when it landed on main.
      - name: Load current release packaging tools
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .pilot-release-tools
          sparse-checkout: apps/macos/scripts
      - name: Apply current packaging policy to tagged application source
        # An older draft must still use ZIP-only publishing and runtime cleanup.
        # Overlay only packaging helpers, keeping the app, dependencies and vendor pins tagged.
        run: |
          cp .pilot-release-tools/apps/macos/scripts/release_metadata.py apps/macos/scripts/release_metadata.py
          cp .pilot-release-tools/apps/macos/scripts/publish-release.sh apps/macos/scripts/publish-release.sh
          # Preserve the executable bit even when retrying a tag with a non-executable helper.
          cp -p .pilot-release-tools/apps/macos/scripts/check-runtime.sh apps/macos/scripts/check-runtime.sh
      - name: Require update signing configuration
        env:
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PUBLIC_KEY" ] || [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo '::error::Configure SPARKLE_PUBLIC_KEY repository variable and SPARKLE_PRIVATE_KEY secret with apps/macos/scripts/setup-updates.sh before publishing.'
            exit 1
          fi
      - name: Build self-contained Pilot.app (arm64 only)
        env:
          BUNDLE_RUNTIME: '1'
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
          LINUX_RUNTIME_PUBLIC_KEY: ${{ vars.LINUX_RUNTIME_PUBLIC_KEY }}
        run: apps/macos/scripts/bundle.sh
      - name: Sign and publish stable release (update ZIP and appcast)
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: apps/macos/scripts/publish-release.sh
