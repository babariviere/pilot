name: Day signing readiness (no signing)

# Deliberately manual only. Provisioning or pushing source starts no signing run.
on:
  workflow_dispatch:

permissions: {}

jobs:
  readiness:
    if: github.repository == 'babariviere/pilot' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Day updater credential without signing
        env:
          DAY_UPDATER_PRIVATE_KEY: ${{ secrets.DAY_UPDATER_PRIVATE_KEY }}
          PUBLIC_KEY: ${{ vars.DAY_UPDATER_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          test -n "$DAY_UPDATER_PRIVATE_KEY" && test -n "$PUBLIC_KEY"
          # Public DER only. Exact Ed25519 prefix and 32-byte key, not a suffix match.
          actual=$(printf '%s' "$DAY_UPDATER_PRIVATE_KEY" | openssl pkey -pubout -outform DER 2>/dev/null | od -An -v -tx1 | tr -d ' \n')
          expected=$(printf '%s' "$PUBLIC_KEY" | openssl base64 -d -A | od -An -v -tx1 | tr -d ' \n')
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]]
          test "$actual" = "302a300506032b6570032100$expected"
          echo 'Day updater key matches configured public key. No bundle signing, notarization, release or native acceptance performed.' >> "$GITHUB_STEP_SUMMARY"
