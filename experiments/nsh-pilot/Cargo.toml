[package]
name = "pilot-nsh-workbench"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
nsh-core = { git = "https://github.com/longbridge/nsh", rev = "3e302abf0cbba712896fc938ca48360fc08c14bb", features = ["svg"] }
nsh-base = { git = "https://github.com/longbridge/nsh", rev = "3e302abf0cbba712896fc938ca48360fc08c14bb", default-features = false, features = ["highlight"] }
nsh-engine = { git = "https://github.com/longbridge/nsh", rev = "3e302abf0cbba712896fc938ca48360fc08c14bb", default-features = false }
nsh-platform-macos = { git = "https://github.com/longbridge/nsh", rev = "3e302abf0cbba712896fc938ca48360fc08c14bb", default-features = false, features = ["highlight"] }
dispatch2 = "0.3.1"

[dev-dependencies]
nsh-testing = { git = "https://github.com/longbridge/nsh", rev = "3e302abf0cbba712896fc938ca48360fc08c14bb", default-features = false }

[profile.dev.package.taffy]
opt-level = 3
[profile.dev.package.syntect]
opt-level = 3
