[package]
name = "chat-gpui-comparison"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
gpui-kit = "=0.8.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
libc = "=0.2.191"

[patch.crates-io]
gpui-base = { path = "../../../apps/desktop/.patched/gpui-base-0.8.0" }
gpui-component = { path = "../../../apps/desktop/.patched/gpui-component-0.8.0" }

[profile.dev]
debug = 0
