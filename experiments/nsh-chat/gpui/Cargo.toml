[package]
name = "chat-gpui-comparison"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
gpui-kit = "=0.8.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
libc = "=0.2.191"

[patch.crates-io]
gpui-pre = { path = "../../../apps/desktop/.patched/gpui-pre-0.3.10" }
gpui-pre-macos = { path = "../../../apps/desktop/.patched/gpui-pre-macos-0.3.10" }
gpui-pre-linux = { path = "../../../apps/desktop/.patched/gpui-pre-linux-0.3.10" }
gpui-base = { path = "../../../apps/desktop/.patched/gpui-base-0.8.1" }
gpui-component = { path = "../../../apps/desktop/.patched/gpui-component-0.8.1" }

[profile.dev]
debug = 0
