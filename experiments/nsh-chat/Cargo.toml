[package]
name = "nsh-chat-prototype"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[patch."https://github.com/longbridge/nsh"]
nsh-core = { path = "output/patched/nsh-core" }
nsh-platform-macos = { path = "output/patched/nsh-platform-macos" }

[dependencies]
nsh-core = { git = "https://github.com/longbridge/nsh", rev = "c7b249970c2f9a15e20c5a461a7324ea9227c08f" }
nsh-base = { git = "https://github.com/longbridge/nsh", rev = "c7b249970c2f9a15e20c5a461a7324ea9227c08f" }
nsh-engine = { git = "https://github.com/longbridge/nsh", rev = "c7b249970c2f9a15e20c5a461a7324ea9227c08f", default-features = false }
nsh-platform-macos = { git = "https://github.com/longbridge/nsh", rev = "c7b249970c2f9a15e20c5a461a7324ea9227c08f", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
env_logger = "0.11"
dispatch2 = "0.3.1"
libc = "0.2.191"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
nsh-testing = { git = "https://github.com/longbridge/nsh", rev = "c7b249970c2f9a15e20c5a461a7324ea9227c08f" }

[profile.dev.package.taffy]
opt-level = 3
[profile.dev.package.syntect]
opt-level = 3
[profile.dev.package.fancy-regex]
opt-level = 3
[profile.dev.package.regex-automata]
opt-level = 3
