[package]
name = "pilot-day-rust"
description = "The mock Pilot Day Today screen written in Rust only, matched to the TSX spike for the stack comparison."
version = "0.1.0"
edition = "2024"
publish = false

# Separate from the Pilot desktop workspace and from the TSX spike's crate:
# this app never links the shipping app, its daemon client or its storage.
[workspace]

[lib]
path = "src/lib.rs"

[dependencies]
# The TSX spike's read model, rules and mock coordinator, used as plain Rust.
pilot-day-native = { path = "../native" }
# Unmodified upstream NSH, the same exact revision as the TSX spike.
nsh-core = { git = "https://github.com/longbridge/nsh", rev = "530b73170f61e5bf16380959de9e622f8ce130cd" }
nsh-base = { git = "https://github.com/longbridge/nsh", rev = "530b73170f61e5bf16380959de9e622f8ce130cd" }

[dev-dependencies]
nsh-engine = { git = "https://github.com/longbridge/nsh", rev = "530b73170f61e5bf16380959de9e622f8ce130cd", default-features = false }
nsh-testing = { git = "https://github.com/longbridge/nsh", rev = "530b73170f61e5bf16380959de9e622f8ce130cd", default-features = false }
